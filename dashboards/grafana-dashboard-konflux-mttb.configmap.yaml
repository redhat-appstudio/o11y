            "name": "datasource",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "regex": "/^rhtap/",
            "type": "datasource"
          },
          {
            "current": {
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "definition": "label_values(source_cluster)",
