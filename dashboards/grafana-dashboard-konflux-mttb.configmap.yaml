apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-konflux-mttb
  labels:
    grafana_dashboard: "true"
  annotations:
    grafana-folder: /grafana-dashboard-definitions/RHTAP
data:
