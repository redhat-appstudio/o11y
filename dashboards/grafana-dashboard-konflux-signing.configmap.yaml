apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-konflux-signing
  labels:
    grafana_dashboard: "true"
  annotations:
    grafana-folder: /grafana-dashboard-definitions/RHTAP
data:
  grafana-dashboard-konflux-signing.json: |-
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "links": [],
      "panels": [
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "panels": [],
          "title": "Signing health",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${Datasource}"
          },
          "description": "Wall-clock age of the most recent successful signing task, per cluster and task. This is the panel that shows a signing outage. A hung signing task never completes, so it is never counted as a failure anywhere else on this dashboard; only the age of the last success moves. Orange at 6h, red at 24h, which is where SigningPipelineNoRecentSuccess fires.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green"
                  },
                  {
                    "color": "orange",
                    "value": 21600
                  },
                  {
                    "color": "red",
                    "value": 86400
                  }
                ]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 1
          },
          "id": 10,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "11.6.11",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${Datasource}"
              },
              "expr": "time() - max by (source_cluster, task) (konflux_signing_last_success_timestamp_seconds{source_cluster=~\"$Cluster\", task=~\"$Task\"})",
              "legendFormat": "{{source_cluster}} / {{task}}",
              "refId": "A",
              "instant": true
            }
          ],
          "title": "Time since last successful signing",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${Datasource}"
          },
          "description": "Volume-weighted success rate per task over the rolling 30-day window: sum(success_count) / sum(total_count). Counts completed signing tasks only.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red"
                  },
                  {
                    "color": "orange",
                    "value": 0.95
                  },
                  {
                    "color": "green",
                    "value": 0.99
                  }
                ]
              },
              "unit": "percentunit",
              "decimals": 3
            },
            "overrides": []
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 1
          },
          "id": 11,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "11.6.11",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${Datasource}"
              },
              "expr": "sum by (task) (konflux_signing_success_count_30d{source_cluster=~\"$Cluster\", task=~\"$Task\"}) / sum by (task) (konflux_signing_total_count_30d{source_cluster=~\"$Cluster\", task=~\"$Task\"})",
              "legendFormat": "{{task}}",
              "refId": "A",
              "instant": true
            }
          ],
          "title": "Signing success rate (30d)",
          "type": "stat"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 8
          },
          "id": 2,
          "panels": [],
          "title": "Volume and outcomes",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${Datasource}"
          },
          "description": "Number of signing tasks that reached a completion time in the rolling 30-day window.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green"
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 9
          },
          "id": 20,
          "options": {
            "displayMode": "gradient",
            "maxVizHeight": 300,
            "minVizHeight": 16,
            "minVizWidth": 8,
            "namePlacement": "auto",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showUnfilled": true,
            "sizing": "auto",
            "valueMode": "color"
          },
          "pluginVersion": "11.6.11",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${Datasource}"
              },
              "expr": "sum by (task) (konflux_signing_total_count_30d{source_cluster=~\"$Cluster\", task=~\"$Task\"})",
              "legendFormat": "{{task}}",
              "refId": "A",
              "instant": true
            }
          ],
          "title": "Completed signing tasks (30d)",
          "type": "bargauge"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${Datasource}"
          },
          "description": "Failed signing tasks broken down by the reason on the Tekton Succeeded condition.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green"
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 9
          },
          "id": 21,
          "options": {
            "displayMode": "gradient",
            "maxVizHeight": 300,
            "minVizHeight": 16,
            "minVizWidth": 8,
            "namePlacement": "auto",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showUnfilled": true,
            "sizing": "auto",
            "valueMode": "color"
          },
          "pluginVersion": "11.6.11",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${Datasource}"
              },
              "expr": "sum by (task, reason) (konflux_signing_failure_count_30d{source_cluster=~\"$Cluster\", task=~\"$Task\"})",
              "legendFormat": "{{task}} / {{reason}}",
              "refId": "A",
              "instant": true
            }
          ],
          "title": "Signing failures by reason (30d)",
          "type": "bargauge"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${Datasource}"
          },
          "description": "Mean duration of successful signing tasks per task and release pipeline.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green"
                  }
                ]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 9
          },
          "id": 22,
          "options": {
            "displayMode": "gradient",
            "maxVizHeight": 300,
            "minVizHeight": 16,
            "minVizWidth": 8,
            "namePlacement": "auto",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showUnfilled": true,
            "sizing": "auto",
            "valueMode": "color"
          },
          "pluginVersion": "11.6.11",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${Datasource}"
              },
              "expr": "max by (task, pipeline) (konflux_signing_mean_duration_seconds_30d{source_cluster=~\"$Cluster\", task=~\"$Task\"})",
              "legendFormat": "{{task}} / {{pipeline}}",
              "refId": "A",
              "instant": true
            }
          ],
          "title": "Mean signing duration (30d)",
          "type": "bargauge"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 17
          },
          "id": 3,
          "panels": [],
          "title": "Duration SLO",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${Datasource}"
          },
          "description": "1 when the daily mean signing duration exceeded the configured threshold on at least the configured share of days in the window. Not emitted while data is insufficient.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green"
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 6,
            "w": 12,
            "x": 0,
            "y": 18
          },
          "id": 30,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "11.6.11",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${Datasource}"
              },
              "expr": "konflux_signing_duration_slo_breach{source_cluster=~\"$Cluster\", task=~\"$Task\"}",
              "legendFormat": "{{source_cluster}} / {{task}} / {{tier}}",
              "refId": "A",
              "instant": true
            }
          ],
          "title": "Signing duration SLO breach",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${Datasource}"
          },
          "description": "Mean time between TaskRun creation and start, for successful signing tasks. A rising wait with a flat duration points at scheduling, not at the signing server.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green"
                  }
                ]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 6,
            "w": 12,
            "x": 12,
            "y": 18
          },
          "id": 31,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "pluginVersion": "11.6.11",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${Datasource}"
              },
              "expr": "max by (task) (konflux_signing_mean_wait_seconds_30d{source_cluster=~\"$Cluster\", task=~\"$Task\"})",
              "legendFormat": "{{task}}",
              "refId": "A",
              "instant": true
            }
          ],
          "title": "Mean signing wait (30d)",
          "type": "stat"
        }
      ],
      "preload": false,
      "schemaVersion": 41,
      "tags": [
        "konflux",
        "release",
        "signing"
      ],
      "templating": {
        "list": [
          {
            "allowCustomValue": false,
            "current": {},
            "name": "Datasource",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "regex": "rhtap-.*",
            "type": "datasource"
          },
          {
            "allowCustomValue": false,
            "current": {},
            "datasource": {
              "type": "prometheus",
              "uid": "${Datasource}"
            },
            "definition": "label_values(konflux_signing_total_count_30d, source_cluster)",
            "includeAll": true,
            "multi": true,
            "name": "Cluster",
            "options": [],
            "query": {
              "qryType": 1,
              "query": "label_values(konflux_signing_total_count_30d, source_cluster)",
              "refId": "PrometheusVariableQueryEditor-VariableQuery"
            },
            "refresh": 1,
            "regex": "",
            "sort": 1,
            "type": "query"
          },
          {
            "allowCustomValue": false,
            "current": {},
            "datasource": {
              "type": "prometheus",
              "uid": "${Datasource}"
            },
            "definition": "label_values(konflux_signing_total_count_30d{source_cluster=~\"$Cluster\"}, task)",
            "includeAll": true,
            "multi": true,
            "name": "Task",
            "options": [],
            "query": {
              "qryType": 1,
              "query": "label_values(konflux_signing_total_count_30d{source_cluster=~\"$Cluster\"}, task)",
              "refId": "PrometheusVariableQueryEditor-VariableQuery"
            },
            "refresh": 1,
            "regex": "",
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "time": {
        "from": "now-7d",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "UTC",
      "title": "Konflux Signing",
      "uid": "konflux-signing"
    }
