apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-kargo-monitoring-overview
  labels:
    grafana_dashboard: "true"
  annotations:
    grafana-folder: /grafana-dashboard-definitions/RHTAP
data:
  kargo-monitoring-overview.json: |-
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "datasource",
              "uid": "grafana"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [
        {
          "asDropdown": false,
          "icon": "external link",
          "includeVars": false,
          "keepTime": false,
          "tags": [],
          "targetBlank": false,
          "title": "API Server Dashboard",
          "tooltip": "",
          "type": "link",
          "url": "https://grafana.app-sre.devshift.net/d/bep80qv02u6tce/konflux-api-server-activity"
        }
      ],
      "panels": [
        {
          "collapsed": true,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 9,
          "panels": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "description": "Number of pending reconciliation items in each Kargo controller workqueue",
              "fieldConfig": {
                "defaults": {
                  "color": {
                    "mode": "palette-classic"
                  },
                  "custom": {
                    "axisBorderShow": false,
                    "axisCenteredZero": false,
                    "axisColorMode": "text",
                    "axisLabel": "",
                    "axisPlacement": "auto",
                    "barAlignment": 0,
                    "barWidthFactor": 0.6,
                    "drawStyle": "line",
                    "fillOpacity": 0,
                    "gradientMode": "none",
                    "hideFrom": {
                      "legend": false,
                      "tooltip": false,
                      "viz": false
                    },
                    "insertNulls": false,
                    "lineInterpolation": "linear",
                    "lineWidth": 1,
                    "pointSize": 5,
                    "scaleDistribution": {
                      "type": "linear"
                    },
                    "showPoints": "auto",
                    "spanNulls": false,
                    "stacking": {
                      "group": "A",
                      "mode": "none"
                    },
                    "thresholdsStyle": {
                      "mode": "off"
                    }
                  },
                  "mappings": [],
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "green"
                      },
                      {
                        "color": "red",
                        "value": 80
                      }
                    ]
                  }
                },
                "overrides": []
              },
              "gridPos": {
                "h": 9,
                "w": 24,
                "x": 0,
                "y": 1
              },
              "id": 17,
              "options": {
                "legend": {
                  "calcs": [],
                  "displayMode": "list",
                  "placement": "bottom",
                  "showLegend": true
                },
                "tooltip": {
                  "hideZeros": false,
                  "mode": "single",
                  "sort": "none"
                }
              },
              "pluginVersion": "11.6.11",
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${datasource}"
                  },
                  "editorMode": "code",
                  "expr": "max by (source_cluster, namespace, name) (\n  workqueue_depth{\n    job=\"kargo-controller-metrics\",\n    source_cluster=~\"${cluster:regex}\"\n  }\n)",
                  "instant": false,
                  "legendFormat": "{{namespace}} / {{name}}",
                  "range": true,
                  "refId": "A"
                }
              ],
              "title": "Kargo Controller Workqueue Depth",
              "type": "timeseries"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "description": "Shows the estimated number of Kargo controller reconciliation errors over a rolling 15-minute window, grouped by cluster, namespace, and controller. Spikes may indicate transient or persistent reconciliation failures.",
              "fieldConfig": {
                "defaults": {
                  "color": {
                    "mode": "palette-classic"
                  },
                  "custom": {
                    "axisBorderShow": false,
                    "axisCenteredZero": false,
                    "axisColorMode": "text",
                    "axisLabel": "",
                    "axisPlacement": "auto",
                    "barAlignment": 0,
                    "barWidthFactor": 0.6,
                    "drawStyle": "line",
                    "fillOpacity": 10,
                    "gradientMode": "none",
                    "hideFrom": {
                      "legend": false,
                      "tooltip": false,
                      "viz": false
                    },
                    "insertNulls": false,
                    "lineInterpolation": "linear",
                    "lineWidth": 2,
                    "pointSize": 5,
                    "scaleDistribution": {
                      "type": "linear"
                    },
                    "showPoints": "auto",
                    "spanNulls": false,
                    "stacking": {
                      "group": "A",
                      "mode": "none"
                    },
                    "thresholdsStyle": {
                      "mode": "off"
                    }
                  },
                  "mappings": [],
                  "min": 0,
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "green"
                      },
                      {
                        "color": "red",
                        "value": 80
                      }
                    ]
                  }
                },
                "overrides": []
              },
              "gridPos": {
                "h": 10,
                "w": 24,
                "x": 0,
                "y": 142
              },
              "id": 16,
              "options": {
                "legend": {
                  "calcs": [
                    "last",
                    "max"
                  ],
                  "displayMode": "table",
                  "placement": "bottom",
                  "showLegend": true
                },
                "tooltip": {
                  "hideZeros": false,
                  "mode": "single",
                  "sort": "none"
                }
              },
              "pluginVersion": "11.6.11",
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${datasource}"
                  },
                  "editorMode": "code",
                  "expr": "sum by (source_cluster, namespace, controller) (\n  increase(\n    controller_runtime_reconcile_errors_total{\n      job=\"kargo-controller-metrics\",\n      namespace=~\"kargo|kargo-shard-infra-deployments-production\",\n      source_cluster=~\"${cluster:regex}\"\n    }[15m]\n  )\n)",
                  "legendFormat": "{{namespace}} / {{controller}}",
                  "range": true,
                  "refId": "A"
                }
              ],
              "title": "Kargo Controller Reconciliation Errors (15m)",
              "type": "timeseries"
            }
          ],
          "title": "Layer 0 — Kargo Controllers Monitoring",
          "type": "row"
        },
        {
          "collapsed": true,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 1
          },
          "id": 10,
          "panels": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "description": "Percentage of available replicas compared to desired replicas for Kargo deployments.",
              "fieldConfig": {
                "defaults": {
                  "color": {
                    "mode": "palette-classic"
                  },
                  "custom": {
                    "axisBorderShow": false,
                    "axisCenteredZero": false,
                    "axisColorMode": "text",
                    "axisLabel": "",
                    "axisPlacement": "auto",
                    "barAlignment": 0,
                    "barWidthFactor": 0.6,
                    "drawStyle": "line",
                    "fillOpacity": 0,
                    "gradientMode": "none",
                    "hideFrom": {
                      "legend": false,
                      "tooltip": false,
                      "viz": false
                    },
                    "insertNulls": false,
                    "lineInterpolation": "linear",
                    "lineWidth": 2,
                    "pointSize": 5,
                    "scaleDistribution": {
                      "type": "linear"
                    },
                    "showPoints": "never",
                    "spanNulls": false,
                    "stacking": {
                      "group": "A",
                      "mode": "none"
                    },
                    "thresholdsStyle": {
                      "mode": "off"
                    }
                  },
                  "decimals": 0,
                  "mappings": [],
                  "max": 100,
                  "min": 0,
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "green"
                      },
                      {
                        "color": "red",
                        "value": 80
                      }
                    ]
                  },
                  "unit": "%"
                },
                "overrides": []
              },
              "gridPos": {
                "h": 9,
                "w": 24,
                "x": 0,
                "y": 2
              },
              "id": 2,
              "options": {
                "legend": {
                  "calcs": [
                    "last",
                    "min"
                  ],
                  "displayMode": "table",
                  "placement": "bottom",
                  "showLegend": true
                },
                "tooltip": {
                  "hideZeros": false,
                  "mode": "single",
                  "sort": "none"
                }
              },
              "pluginVersion": "11.6.11",
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${datasource}"
                  },
                  "editorMode": "code",
                  "expr": "100 *\nsum by (source_cluster, namespace, deployment) (\n  kube_deployment_status_replicas_available{\n    namespace=~\".*kargo.*\",\n    source_cluster=~\"${cluster:regex}\"\n  }\n)\n/\non (source_cluster, namespace, deployment)\nclamp_min(\n  sum by (source_cluster, namespace, deployment) (\n    kube_deployment_spec_replicas{\n      namespace=~\".*kargo.*\",\n      source_cluster=~\"${cluster:regex}\"\n    }\n  ),\n  1\n)",
                  "legendFormat": "{{source_cluster}} / {{namespace}} / {{deployment}}",
                  "range": true,
                  "refId": "A"
                }
              ],
              "title": "Kargo Deployment Availability (%)",
              "type": "timeseries"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "description": "Monitors available versus desired replicas for Kargo deployments across clusters and namespaces. Solid lines represent available replicas, while dashed lines represent desired replicas. A gap between the two indicates that a deployment has not reached its desired replica count.",
              "fieldConfig": {
                "defaults": {
                  "color": {
                    "mode": "palette-classic"
                  },
                  "custom": {
                    "axisBorderShow": false,
                    "axisCenteredZero": false,
                    "axisColorMode": "text",
                    "axisLabel": "",
                    "axisPlacement": "auto",
                    "barAlignment": 0,
                    "barWidthFactor": 0.6,
                    "drawStyle": "line",
                    "fillOpacity": 0,
                    "gradientMode": "none",
                    "hideFrom": {
                      "legend": false,
                      "tooltip": false,
                      "viz": false
                    },
                    "insertNulls": false,
                    "lineInterpolation": "linear",
                    "lineWidth": 1,
                    "pointSize": 5,
                    "scaleDistribution": {
                      "type": "linear"
                    },
                    "showPoints": "auto",
                    "spanNulls": false,
                    "stacking": {
                      "group": "A",
                      "mode": "none"
                    },
                    "thresholdsStyle": {
                      "mode": "off"
                    }
                  },
                  "mappings": [],
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "green"
                      },
                      {
                        "color": "red",
                        "value": 80
                      }
                    ]
                  }
                },
                "overrides": [
                  {
                    "matcher": {
                      "id": "byRegexp",
                      "options": ".* — Desired$"
                    },
                    "properties": [
                      {
                        "id": "custom.lineStyle",
                        "value": {
                          "dash": [
                            10,
                            10
                          ],
                          "fill": "dash"
                        }
                      }
                    ]
                  }
                ]
              },
              "gridPos": {
                "h": 9,
                "w": 24,
                "x": 0,
                "y": 143
              },
              "id": 22,
              "options": {
                "legend": {
                  "calcs": [],
                  "displayMode": "list",
                  "placement": "bottom",
                  "showLegend": true
                },
                "tooltip": {
                  "hideZeros": false,
                  "mode": "multi",
                  "sort": "none"
                }
              },
              "pluginVersion": "11.6.11",
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${datasource}"
                  },
                  "editorMode": "code",
                  "expr": "\nsum by (source_cluster, namespace, deployment) (\n  kube_deployment_status_replicas_available{\n    namespace=~\".*kargo.*\",\n    source_cluster=~\"${cluster:regex}\"\n  }\n)\n",
                  "hide": false,
                  "legendFormat": "{{namespace}} / {{deployment}} — Available",
                  "range": true,
                  "refId": "A"
                },
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${datasource}"
                  },
                  "editorMode": "code",
                  "expr": "\nsum by (source_cluster, namespace, deployment) (\n  kube_deployment_spec_replicas{\n    namespace=~\".*kargo.*\",\n    source_cluster=~\"${cluster:regex}\"\n  }\n)\n",
                  "hide": false,
                  "instant": false,
                  "legendFormat": "{{namespace}} / {{deployment}} — Desired",
                  "range": true,
                  "refId": "B"
                }
              ],
              "title": "Kargo Deployment Replicas — Available vs Desired",
              "type": "timeseries"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "description": "Displays the number of container restarts across Kargo pods during the last hour. Helps identify potential pod instability, crashes, or repeated restarts affecting Kargo deployment health.",
              "fieldConfig": {
                "defaults": {
                  "color": {
                    "mode": "palette-classic"
                  },
                  "custom": {
                    "axisBorderShow": false,
                    "axisCenteredZero": false,
                    "axisColorMode": "text",
                    "axisLabel": "",
                    "axisPlacement": "auto",
                    "barAlignment": 0,
                    "barWidthFactor": 0.6,
                    "drawStyle": "line",
                    "fillOpacity": 10,
                    "gradientMode": "none",
                    "hideFrom": {
                      "legend": false,
                      "tooltip": false,
                      "viz": false
                    },
                    "insertNulls": false,
                    "lineInterpolation": "linear",
                    "lineWidth": 2,
                    "pointSize": 5,
                    "scaleDistribution": {
                      "type": "linear"
                    },
                    "showPoints": "auto",
                    "spanNulls": false,
                    "stacking": {
                      "group": "A",
                      "mode": "none"
                    },
                    "thresholdsStyle": {
                      "mode": "off"
                    }
                  },
                  "decimals": 0,
                  "displayName": "Total Kargo Restarts",
                  "mappings": [],
                  "max": 10,
                  "min": 0,
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "color": "green"
                      },
                      {
                        "color": "red",
                        "value": 80
                      }
                    ]
                  }
                },
                "overrides": []
              },
              "gridPos": {
                "h": 8,
                "w": 24,
                "x": 0,
                "y": 152
              },
              "id": 4,
              "options": {
                "legend": {
                  "calcs": [],
                  "displayMode": "list",
                  "placement": "bottom",
                  "showLegend": true
                },
                "tooltip": {
                  "hideZeros": false,
                  "mode": "single",
                  "sort": "none"
                }
              },
              "pluginVersion": "11.6.11",
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${datasource}"
                  },
                  "editorMode": "code",
                  "expr": "sum(\n  increase(\n    kube_pod_container_status_restarts_total{\n      namespace=~\".*kargo.*\",\n      source_cluster=~\"${cluster:regex}\"\n    }[1h]\n  )\n)",
                  "legendFormat": "Total Kargo Restarts",
                  "range": true,
                  "refId": "A"
                }
              ],
              "title": "Kargo Pod Restarts (Last 1 Hour)",
              "type": "timeseries"
            }
          ],
          "title": "Layer 1 — Kargo Cluster Deployment Monitoring",
          "type": "row"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 2
          },
          "id": 21,
          "panels": [],
          "title": "Layers 2 & 3 — Kargo Application Monitoring",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Number of Kargo Stages whose latest promotion finished within the last 24 hours, grouped by namespace. Uses the recorded metric available in RHOBS.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "displayName": "${__field.labels.exported_namespace}",
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green"
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 7,
            "w": 10,
            "x": 0,
            "y": 3
          },
          "id": 15,
          "options": {
            "colorMode": "none",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "percentChangeColorMode": "standard",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "text": {},
            "textMode": "value_and_name",
            "wideLayout": true
          },
          "pluginVersion": "11.6.11",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "exemplar": false,
              "expr": "count by (source_cluster, exported_namespace) (\n  kargo:stage:last_promotion:finished_timestamp{\n    source_cluster=~\"${cluster:regex}\",\n    exported_namespace=~\"${namespace:regex}\",\n    stage=~\"${stage:regex}\",\n    component=~\"${component:regex}\"\n  } > time() - 86400\n)",
              "instant": true,
              "legendFormat": "__auto",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Kargo Stages with Recent Promotions (24h)",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Percentage of successful Kargo promotions over the rolling 24-hour window, grouped by namespace. Calculated from completed promotion counters. Interpret alongside completion counts when sample volume is low.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 1,
              "displayName": "${__field.labels.exported_namespace}",
              "mappings": [],
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "dark-red"
                  },
                  {
                    "color": "#EAB839",
                    "value": 90
                  },
                  {
                    "color": "dark-green",
                    "value": 95
                  }
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 7,
            "w": 14,
            "x": 10,
            "y": 3
          },
          "id": 13,
          "options": {
            "minVizHeight": 75,
            "minVizWidth": 75,
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true,
            "sizing": "auto"
          },
          "pluginVersion": "11.6.11",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "exemplar": false,
              "expr": "100 *\ncount by (source_cluster, exported_namespace) (\n  kargo:stage:last_promotion:finished_timestamp{\n    source_cluster=~\"${cluster:regex}\",\n    exported_namespace=~\"${namespace:regex}\",\n    stage=~\"${stage:regex}\",\n    component=~\"${component:regex}\",\n    phase=\"Succeeded\"\n  } > time() - 86400\n)\n/\ncount by (source_cluster, exported_namespace) (\n  kargo:stage:last_promotion:finished_timestamp{\n    source_cluster=~\"${cluster:regex}\",\n    exported_namespace=~\"${namespace:regex}\",\n    stage=~\"${stage:regex}\",\n    component=~\"${component:regex}\"\n  } > time() - 86400\n)",
              "instant": true,
              "legendFormat": "{{namespace}}",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Kargo Latest Promotion Success Rate (Stages Updated in 24h)",
          "type": "gauge"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Aggregates Kargo Stage CR conditions and reasons",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "filterable": true,
                "inspect": false
              },
              "decimals": 0,
              "mappings": [],
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green"
                  },
                  {
                    "color": "red",
                    "value": 80
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Reason"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "options": {
                          "NoFreight": {
                            "color": "orange",
                            "index": 2
                          }
                        },
                        "type": "value"
                      },
                      {
                        "options": {
                          "pattern": "(.*[eE]rror.*|.*[fF]ail.*)",
                          "result": {
                            "color": "dark-red",
                            "index": 0,
                            "text": "$1"
                          }
                        },
                        "type": "regex"
                      },
                      {
                        "options": {
                          "pattern": "(.*[aA]bort.*)",
                          "result": {
                            "color": "orange",
                            "index": 1,
                            "text": "$1"
                          }
                        },
                        "type": "regex"
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Cluster"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 258
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 10
          },
          "id": 12,
          "options": {
            "cellHeight": "md",
            "footer": {
              "countRows": false,
              "fields": "",
              "reducer": [
                "sum"
              ],
              "show": false
            },
            "showHeader": true,
            "sortBy": []
          },
          "pluginVersion": "11.6.11",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "exemplar": false,
              "expr": "count by (source_cluster, condition, exported_namespace, reason) (\n  kargo:stage:condition:last_transition_timestamp{\n    source_cluster=~\"${cluster:regex}\",\n    exported_namespace=~\"${namespace:regex}\",\n    stage=~\"${stage:regex}\",\n    component=~\"${component:regex}\",\n    condition=~\".+\",\n    reason=~\".+\"\n  }\n)",
              "format": "table",
              "instant": true,
              "legendFormat": "{{namespace}} / {{reason}}",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Kargo Stage Conditions Overview",
          "transformations": [
