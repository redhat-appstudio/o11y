apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: rhtap-konflux-ui-service-availability
  labels:
    tenant: rhtap
spec:
  groups:
    - name: konflux_ui_service_availability
      interval: 1m
      rules:
        - record: konflux_up
          expr: |
            clamp_max(
              label_replace(
                label_replace(
                  floor(
                    kube_deployment_status_replicas_available{
                      namespace="konflux-ui", deployment="proxy"
                    } / (kube_deployment_spec_replicas * 2/3)
                  ), "check", "replicas-available", "",""
                ), "service", "$1", "deployment","(.*)"
              ), 1
            )
        - record: konflux_up
          expr: |
            clamp_max(
              label_replace(
                label_replace(
                  floor(
                    kube_deployment_status_replicas_available{
                      namespace="konflux-ui", deployment="dex"
                    } / (kube_deployment_spec_replicas * 2/3)
                  ), "check", "replicas-available", "",""
                ), "service", "$1", "deployment","(.*)"
              ), 1
            )
        - record: nginx_otel_http_request_errors:rate5m
          expr: sum(rate(nginx_otel_http_request_errors_total[5m])) by (job, status, source_cluster)

        - record: nginx_otel_http_request_errors:rate24h_avg
          expr: avg_over_time(nginx_otel_http_request_errors:rate5m[24h])

        - record: nginx_otel_http_request_errors:rate24h_stddev
          expr: stddev_over_time(nginx_otel_http_request_errors:rate5m[24h])

        # Konflux UI proxy (Caddy) HTTP 4xx/5xx rates from histogram _count.
        # label_replace maps code → status for alert matchers (status=~"5..", etc.).
        # Caddy increments _count once per middleware handler for the same request —
        # max without (handler, method, server) collapses that to one request-level rate,
        # then sum across pods/instances by (job, status, source_cluster).
        - record: caddy_http_request_errors:rate5m
          expr: |
            sum by (job, status, source_cluster) (
              max without (handler, method, server) (
                label_replace(
                  rate(
                    caddy_http_request_duration_seconds_count{
                      namespace="konflux-ui",
                      code=~"4..|5.."
                    }[5m]
                  ),
                  "status", "$1", "code", "(.*)"
                )
              )
            )

        - record: caddy_http_request_errors:rate24h_avg
          expr: avg_over_time(caddy_http_request_errors:rate5m[24h])

        - record: caddy_http_request_errors:rate24h_stddev
          expr: stddev_over_time(caddy_http_request_errors:rate5m[24h])
