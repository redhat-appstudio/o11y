apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: rhtap-pod-alerting-rules
  labels:
    tenant: rhtap
spec:
  groups:
  - name: pod_alerts
    interval: 1m
    rules:
    - alert: UnschedulablePods
      expr: |
        min_over_time(kube_pod_status_unschedulable{namespace!~"(.*-tenant|.*-env|openshift-.*|kube-.*|default|tekton-ci|build-templates-e2e|multi-platform-.*|clusters-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|clusters|proactive-scaler|.*-provision-namespace-.*|.*-provision-eaas-space-.*|.*-provision-env-.*|.*-deploy-ephemeral-.*)"}[5m]) == 1
        or
        (
          min_over_time(kube_pod_status_unschedulable{namespace="proactive-scaler"}[5m]) == 1
          and on (source_cluster)
          (
            sum by (source_cluster) (cluster_autoscaler_nodes_count)
            < on (source_cluster)
            max by (source_cluster) (cluster_autoscaler_max_nodes_count)
          )
        )
      for: 60m
      labels:
        severity: warning
        slo: "false"
        team: o11y
        component: pod-management
      annotations:
        summary: Pod {{ $labels.namespace }}/{{ $labels.pod }} on {{ $labels.source_cluster }} cannot be scheduled.
        description: >-
          Pod {{ $labels.pod }} for namespace {{ $labels.namespace }} on cluster
          {{ $labels.source_cluster }} is unscheduled for more than 60 minutes.
        alert_routing_key: '{{ $labels.namespace }}'
        runbook_url: https://gitlab.cee.redhat.com/konflux/docs/sop/-/blob/main/o11y/alerting/alert-rules/alert-rule-unschedulablePods.md
    - alert: CrashLoopBackOff
      expr: max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff", namespace!~"(.*-tenant|.*-env|openshift-.*|kube-.*|default|tekton-ci|build-templates-e2e|multi-platform-.*|clusters-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|tekton-kueue)"}[5m]) >= 1
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: Pod {{ $labels.pod }} is crash looping
        description: >-
          Pod {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) is in
          waiting state (reason: 'CrashLoopBackOff') on cluster
          {{ $labels.source_cluster }} for more than 15 minutes.
        alert_routing_key: '{{ $labels.namespace }}'
        runbook_url: https://gitlab.cee.redhat.com/konflux/docs/sop/-/blob/main/o11y/alerting/alert-rules/alert-rule-crashLoopBackOff.md
    # While kubelet retries a failing pull the container flips between the
    # 'ErrImagePull' and 'ImagePullBackOff' waiting reasons, so an instant match on
    # ImagePullBackOff alone has gaps. max_over_time() closes them. The same
    # namespace exclusions as CrashLoopBackOff are used: tenant workloads pull
    # user-supplied images and are not actionable for the platform teams.
    - alert: ImagePullBackOff
      expr: max_over_time(kube_pod_container_status_waiting_reason{reason="ImagePullBackOff", namespace!~"(.*-tenant|.*-env|openshift-.*|kube-.*|default|tekton-ci|build-templates-e2e|multi-platform-.*|clusters-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|tekton-kueue)"}[15m]) >= 1
      for: 30m
      labels:
        severity: warning
        slo: "false"
      annotations:
        summary: Pod {{ $labels.pod }} cannot pull its image
        description: >-
          Pod {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) is in
          waiting state (reason: 'ImagePullBackOff') on cluster
          {{ $labels.source_cluster }} for more than 30 minutes. The image is missing,
          the digest is stale, or the registry rejects the pull.
        alert_routing_key: '{{ $labels.namespace }}'
        runbook_url: https://gitlab.cee.redhat.com/konflux/docs/sop/-/blob/main/o11y/alerting/alert-rules/alert-rule-imagePullBackOff.md
    - alert: PodNotReady
      expr: |
            kube_pod_status_phase:excluding_jobs{
              namespace!~"(.*-tenant|.*-env|openshift-.*|kube-.*|default|tekton-ci|build-templates-e2e|konflux-ci|mintmaker|multi-platform-.*|appstudio-kanary-exporter|clusters|clusters-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|tekton-kueue)"
            } == 1
            unless on (namespace, pod, source_cluster) (kube_pod_status_unschedulable == 1)
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: >-
          Pod {{ $labels.pod }} is not ready
        description: >-
          Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} on cluster
          {{ $labels.source_cluster }} is not ready for more than 30 minutes.
        alert_routing_key: '{{ $labels.namespace }}'
        runbook_url: https://gitlab.cee.redhat.com/konflux/docs/sop/-/blob/main/o11y/alerting/alert-rules/alert-rule-PodNotReady.md

    - alert: PodMemoryUsageExceedsRequested
      expr: |
        sum by (namespace, pod, container, source_cluster) (
          container_memory_usage_bytes{
            namespace="appstudio-grafana",
            container!="",
            container!="POD"
          }
        )
        > on(namespace, pod, container, source_cluster)
        sum by (namespace, pod, container, source_cluster) (
          kube_pod_container_resource_requests{
            resource="memory",
            namespace="appstudio-grafana"
          }
        )
      for: 10m
      labels:
        severity: warning
      annotations:
        team: o11y
        slo: "false"
        alert_routing_key: o11y
        summary: >-
          Pod {{ $labels.pod }} memory usage is exceeding the requested resource.
        description: >-
          Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} on cluster
          {{ $labels.source_cluster }} has been running above the requested memory resources.

    - alert: PodCPUUsageExceedsRequested
      expr: |
        sum by (namespace, pod, container, source_cluster) (
          rate(container_cpu_usage_seconds_total{
            namespace="appstudio-grafana",
            container!="",
            container!="POD"
          }[5m])
        )
        > on(namespace, pod, container, source_cluster)
        sum by (namespace, pod, container, source_cluster) (
          kube_pod_container_resource_requests{
            resource="cpu",
            unit="core",
            namespace="appstudio-grafana"
          }
        )
      for: 5m
      labels:
        severity: warning
      annotations:
        team: o11y
        slo: "false"
        alert_routing_key: o11y
        summary: >-
          Pod {{ $labels.pod }} cpu usage is exceeding the requested resource.
        description: >-
          Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} on cluster
          {{ $labels.source_cluster }} has been running above the requested cpu resources.

    - alert: PodOOMKilled
      expr: |
        (
          count(kube_pod_container_status_terminated_reason{reason="OOMKilled",namespace!~"(.*-tenant|.*-env|openshift-.*|kube-.*|default|tekton-ci|build-templates-e2e|konflux-ci|mintmaker|tekton-kueue)"}) by (source_cluster,namespace,container,pod) >= 1
        )
        unless on (source_cluster, namespace, container, pod)
        (
          kube_pod_container_status_terminated_reason{reason="OOMKilled",namespace="internal-services",source_cluster=~"kflux-c-.*",pod=~".*controller.*|.*manager.*"}
        )
      for: 5m
      labels:
        severity: warning
        reason: "OOMKilled"
        slo: "false"
      annotations:
        summary: "Pod {{ $labels.pod }} ran out of memory - OOMKilled."
        description: "Pod {{ $labels.pod }} in Namespace {{ $labels.namespace }} was killed due to OOM."
        alert_routing_key: "{{ $labels.namespace }}"
        runbook_url: 'https://gitlab.cee.redhat.com/konflux/docs/sop/-/blob/main/sre/alert-rule-OOMKilledAlert.md'

    - alert: ControllerPodOOMKilled
      expr: |
        count(kube_pod_container_status_terminated_reason{reason="OOMKilled",namespace!~"(.*-tenant|.*-env|openshift-.*|kube-.*|default|tekton-ci|build-templates-e2e|konflux-ci|mintmaker|tekton-kueue|internal-services)", pod=~".*controller.*|.*manager.*"}) by (source_cluster,namespace,container,pod) >= 1
      for: 5m
      labels:
        severity: critical
        reason: "OOMKilled"
        slo: "true"
      annotations:
        html_url: https://github.com/redhat-appstudio/o11y/blob/main/rhobs/alerting/data_plane/prometheus.pod_alerts.yaml#L103
        summary: "Pod {{ $labels.pod }} ran out of memory - OOMKilled."
        description: "Pod {{ $labels.pod }} in Namespace {{ $labels.namespace }} was killed due to OOM."
        alert_team_handle: >- # testing
          <!subteam^S0C4VKLC9KP> <!subteam^S05Q1P4Q2TG>
        runbook_url: 'https://gitlab.cee.redhat.com/konflux/docs/sop/-/blob/main/sre/alert-rule-OOMKilledAlert.md'

    - alert: InternalServicesControllerPodOOMKilled
      expr: |
        count(kube_pod_container_status_terminated_reason{reason="OOMKilled",namespace="internal-services",source_cluster=~"kflux-c-.*",pod=~".*controller.*|.*manager.*"}) by (source_cluster,namespace,container,pod) >= 1
      for: 5m
      labels:
        severity: critical
        reason: "OOMKilled"
        slo: "true"
      annotations:
        html_url: https://github.com/redhat-appstudio/o11y/blob/main/rhobs/alerting/data_plane/prometheus.pod_alerts.yaml#L151
        summary: "Pod {{ $labels.pod }} ran out of memory - OOMKilled."
        description: "Pod {{ $labels.pod }} in Namespace {{ $labels.namespace }} on cluster {{ $labels.source_cluster }} was killed due to OOM."
        alert_team_handle: '<!subteam^S03SVBS426R>'
        team: release
        runbook_url: 'https://gitlab.cee.redhat.com/konflux/docs/sop/-/blob/main/release-service/sre/alert-InternalServicesControllerPodOOMKilled.md'
