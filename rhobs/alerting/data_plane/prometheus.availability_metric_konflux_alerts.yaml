apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: rhtap-konflux-up-alerting
  labels:
    tenant: rhtap
spec:
  groups:
  - name: konflux_up_alerts
    interval: 1m
    rules:
    - alert: KonfluxAlert
      expr: |
        count by (source_cluster) (
          group by (service, check, source_cluster) (
            (sum by (service, check, source_cluster, namespace) (count_over_time(konflux_up[2h])) > 0)
            unless on(service, check, source_cluster, namespace)
            (sum by (service, check, source_cluster, namespace) (count_over_time(konflux_up[10m])) > 0)
          )
        ) > 2
      for: 30m
      labels:
        severity: warning
        slo: "false"
        component: o11y
      annotations:
        summary: Availability metric 'konflux_up' is missing on cluster {{ $labels.source_cluster }}.
        description: >-
          3 or more availability metrics on cluster {{ $labels.source_cluster }} have not reported
          in the last 10 minutes but were seen in the last 2 hours. This likely indicates a monitoring
          pipeline disruption rather than individual service failures. Note: isolated single-service
          absences are not detected by this rule by design; the cardinality threshold suppresses
          false positives from platform-wide scrape gaps.
        alert_routing_key: 'o11y'
        team: o11y
