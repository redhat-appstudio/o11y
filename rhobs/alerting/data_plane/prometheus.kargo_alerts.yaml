apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: rhtap-kargo-alerting-rules
  labels:
    tenant: rhtap
spec:
  groups:
    - name: kargo-reconciliation-alerts
      interval: 1m
      rules:
        - alert: KargoInfraShardReconcileErrors
          expr: |
            sum by (namespace, controller, source_cluster) (
              increase(controller_runtime_reconcile_errors_total{
                job="kargo-controller-metrics",
                namespace="kargo-shard-infra-deployments-production"
              }[15m])
            ) > 5
          for: 10m
          labels:
            severity: warning
            component: kargo
            slo: "false"
          annotations:
            summary: >-
              Kargo infrastructure shard reconciliation errors
              in {{ $labels.source_cluster }}
            description: >-
              Kargo controller {{ $labels.controller }} in namespace
              {{ $labels.namespace }} has experienced more than
              5 reconciliation errors in 15 minutes, sustained
              for 10 minutes. This may impact infrastructure
              and ring deployments.
            alert_routing_key: spreandinfra
    - name: kargo-availability-alerts
      interval: 1m
      rules:
        - alert: KargoDeploymentUnavailable
          expr: |
            konflux_up{
              namespace=~"kargo|kargo-shard-infra-deployments|kargo-shard-infra-deployments-production",
              service="kargo-controller",
              check="replicas-available"
            } == 0
          for: 15m
          labels:
            severity: critical
            slo: "true"
            component: kargo
          annotations:
            html_url: https://github.com/redhat-appstudio/o11y/blob/main/rhobs/alerting/data_plane/prometheus.kargo_alerts.yaml#L39
            summary: >-
              Kargo controller unavailable in {{ $labels.source_cluster }}
            description: >-
              Kargo controller in namespace {{ $labels.namespace }}
              has been unavailable for 15 minutes in cluster
              {{ $labels.source_cluster }}.
            alert_team_handle: >-
              <!subteam^S07SW2EEW3D> <!subteam^S05Q1P4Q2TG>
            team: konflux-infra
            runbook_url: https://gitlab.cee.redhat.com/konflux/docs/sop/-/blob/main/infra/sre/alert-KargoDeploymentUnavailable.md
    - name: kargo-promotion-alerts
      interval: 1m
      rules:
        - alert: KargoPromotionFailed
          expr: |
            label_replace(
            (
            (
              max by (exported_namespace, component, stage) (
                kargo:stage:last_promotion:finished_timestamp{phase=~"Failed|Errored"}
              )
              unless on (exported_namespace, component, stage)
              (
                max by (exported_namespace, component, stage) (
                  kargo:stage:last_promotion:finished_timestamp{phase=~"Succeeded|Aborted"}
                )
                >= on (exported_namespace, component, stage)
                max by (exported_namespace, component, stage) (
                  kargo:stage:last_promotion:finished_timestamp{phase=~"Failed|Errored"}
                )
              )
            )
            and
            (
              (time() - max by (exported_namespace, component, stage) (
                kargo:stage:last_promotion:finished_timestamp{phase=~"Failed|Errored"}
              )) >= 0
            )
            and
            (
              (time() - max by (exported_namespace, component, stage) (
                kargo:stage:last_promotion:finished_timestamp{phase=~"Failed|Errored"}
              )) < 1800
            )
            ),
            "kargo_component", "$1", "component", "(.+)"
            )
          for: 2m
          labels:
            severity: critical
            component: kargo
            slo: "true"
          annotations:
            html_url: https://github.com/redhat-appstudio/o11y/blob/main/rhobs/alerting/data_plane/prometheus.kargo_alerts.yaml
            summary: >-
              Kargo promotion failed: {{ $labels.kargo_component }} / {{ $labels.stage }}
            description: >-
              A recent Kargo promotion failed or errored in namespace
              {{ $labels.exported_namespace }}.
            alert_team_handle: >-
              <!subteam^S07SW2EEW3D> <!subteam^S05Q1P4Q2TG>
            team: konflux-infra
            runbook_url: https://gitlab.cee.redhat.com/konflux/docs/sop/-/blob/main/infra/sre/alert-KargoPromotionFailed.md
        - alert: KargoAutoPromotionHoldTooLong
          expr: |
            label_replace(
            (
            (
              time() - kargo:stage:effective_auto_promotion_hold:created_timestamp{
                exported_namespace!="kargo-production-playground"
              }
            ) > 86400
            ),
            "kargo_component", "$1", "component", "(.+)"
            )
          for: 5m
          labels:
            severity: warning
            component: kargo
            slo: "false"
          annotations:
            html_url: https://github.com/redhat-appstudio/o11y/blob/main/rhobs/alerting/data_plane/prometheus.kargo_alerts.yaml
            summary: >-
              Kargo auto-promotion hold exceeds 24h: {{ $labels.kargo_component }} / {{ $labels.stage }}
            description: >-
              Auto-promotion hold timestamp is older than 24 hours in
              {{ $labels.exported_namespace }}.
            alert_routing_key: spreandinfra
