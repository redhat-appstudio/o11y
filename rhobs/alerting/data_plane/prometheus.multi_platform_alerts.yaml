apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: rhtap-multiplatform-availability-alerting-rules
  labels:
    tenant: rhtap

spec:
  groups:
  - name: multi-platform-controller-availability
    interval: 1m
    rules:
    - alert: MultiPlatformControllerDown
      expr: |
        konflux_up{
          namespace="multi-platform-controller",
          check="replicas-available",
          service="multi-platform-controller"
        } != 1
      for: 5m
      labels:
        severity: critical
        slo: "true"
        component: multi-platform-controller
      annotations:
        html_url: https://github.com/redhat-appstudio/o11y/blob/main/rhobs/alerting/data_plane/prometheus.multi_platform_alerts.yaml#L13
        summary: >-
          Multiplatform controller is down in cluster {{ $labels.source_cluster }}
        description: >
          The multi-platform-controller pod has been down for 5min in cluster {{ $labels.source_cluster }}
        alert_team_handle: <!subteam^S05Q1P4Q2TG>
        team: konflux-infra
        runbook_url: https://gitlab.cee.redhat.com/konflux/docs/sop/-/blob/main/o11y/alerting/alert-rules/alert-rule-MultiPlatformControllerDown.md

  - name: multi-platform-otp-availability
    interval: 1m
    rules:
    - alert: MultiPlatformOTPDown
      expr: |
        konflux_up{
          namespace="multi-platform-controller",
          check="replicas-available",
          service="multi-platform-otp-server"
        } != 1
      for: 5m
      labels:
        severity: critical
        slo: "true"
        component: multi-platform-controller
      annotations:
        html_url: https://github.com/redhat-appstudio/o11y/blob/main/rhobs/alerting/data_plane/prometheus.multi_platform_alerts.yaml#L38
        summary: >-
          Multiplatform OTP is down in cluster {{ $labels.source_cluster }}
        description: >
          The multi-platform otp pod has been down for 5min in cluster {{ $labels.source_cluster }}
        alert_team_handle: <!subteam^S05Q1P4Q2TG>
        team: konflux-infra
        runbook_url: https://gitlab.cee.redhat.com/konflux/docs/sop/-/blob/main/o11y/alerting/alert-rules/alert-rule-MultiPlatformOTPDown.md

  - name: multi-platform-controller-platform-health
    interval: 1m
    rules:
    - alert: MultiPlatformControllerPlatformUnhealthy
      expr: |
        (increase(multi_platform_controller_provisioning_successes[15m]) / (increase(multi_platform_controller_provisioning_successes[15m]) + increase(multi_platform_controller_provisioning_failures[15m]))) * 100 < 50
      for: 5m
      labels:
        severity: high
        slo: "false"
        component: multi-platform-controller
      annotations:
        summary: >-
          Multi-platform controller platform {{ $labels.platform }} health check failed in cluster {{ $labels.source_cluster }}
        description: >
          The multi-platform controller platform health check "{{ $labels.platform }}" has more than 50% provisioning failures for the last 15 minutes in cluster {{ $labels.source_cluster }}
        alert_routing_key: infra
        team: konflux-infra
        runbook_url: https://gitlab.cee.redhat.com/konflux/docs/sop/-/blob/main/o11y/alerting/alert-rules/alert-rule-MultiPlatformControllerPlatformUnhealthy.md

  - name: multi-platform-controller-metrics-health
    interval: 30s
    rules:
    - alert: MultiPlatformControllerMetricsUnhealthy
      expr: |
        count by (source_cluster) (multi_platform_controller_running_tasks < 0 or multi_platform_controller_waiting_tasks < 0) > 0
      for: 1m
      labels:
        severity: warning
        component: multi-platform-controller
      annotations:
        summary: >-
          Multi-platform controller metrics are unhealthy in cluster {{ $labels.source_cluster }}
        description: >-
          The multi-platform controller Gauge metrics are showing negative values for the last 1 minute in cluster {{ $labels.source_cluster }}
        alert_routing_key: infra
        team: konflux-infra

  - name: multi-platform-controller-capacity
    interval: 1m
    rules:
    # host_allocation_time is observed only on successful host assignment
    # (pkg/reconciler/taskrun/taskrun.go), so this denominator is successes.
    - alert: MultiPlatformControllerHostAllocationFailuresHigh
      expr: |
        (
          (
            sum by (source_cluster, platform) (increase(multi_platform_controller_host_allocation_failures[1h]))
            /
            sum by (source_cluster, platform) (increase(multi_platform_controller_host_allocation_time_count[1h]))
          ) > 0.25
          and
          sum by (source_cluster, platform) (increase(multi_platform_controller_host_allocation_failures[1h])) >= 5
          and
          sum by (source_cluster, platform) (increase(multi_platform_controller_host_allocation_time_count[1h])) > 0
        )
        or
        sum by (source_cluster, platform) (increase(multi_platform_controller_host_allocation_failures[1h])) >= 25
      for: 15m
      labels:
        severity: warning
        slo: "false"
        component: multi-platform-controller
      annotations:
        summary: >-
          Multi-platform controller host allocation failures are elevated for {{ $labels.platform }} in cluster {{ $labels.source_cluster }}
        description: >-
          Multi-platform controller recorded over 25% as many host allocation failures as successful allocations (minimum 5 failures), or at least 25 failures per hour, for 15 minutes in cluster {{ $labels.source_cluster }}
        alert_routing_key: infra
        team: konflux-infra
        runbook_url: https://gitlab.cee.redhat.com/konflux/docs/sop/-/blob/main/o11y/alerting/alert-rules/alert-rule-multi-platform-host-pool.md

    # No absolute-failure branch: the zero-denominator guard keeps this silent when no
    # task runs completed, where a failure ratio has no meaning.
    - alert: MultiPlatformControllerCleanupFailuresHigh
      expr: |
        (
          sum by (source_cluster, platform) (increase(multi_platform_controller_cleanup_failures[1h]))
          /
          sum by (source_cluster, platform) (increase(multi_platform_controller_task_run_time_count[1h]))
        ) > 0.10
        and
        sum by (source_cluster, platform) (increase(multi_platform_controller_cleanup_failures[1h])) >= 3
        and
        sum by (source_cluster, platform) (increase(multi_platform_controller_task_run_time_count[1h])) > 0
      for: 15m
      labels:
        severity: warning
        slo: "false"
        component: multi-platform-controller
      annotations:
        summary: >-
          Multi-platform controller cleanup failures are elevated for {{ $labels.platform }} in cluster {{ $labels.source_cluster }}
        description: >-
          Multi-platform controller cleanup failures exceeded 10% of completed task runs for 15 minutes in cluster {{ $labels.source_cluster }}
        alert_routing_key: infra
        team: konflux-infra
        runbook_url: https://gitlab.cee.redhat.com/konflux/docs/sop/-/blob/main/o11y/alerting/alert-rules/alert-rule-multi-platform-host-pool.md
