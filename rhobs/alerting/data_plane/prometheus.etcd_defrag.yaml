apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: rhtap-etcd-defrag-alerting
  labels:
    tenant: rhtap
spec:
  groups:
    - name: etcd_defrag_alerts
      interval: 1m
      rules:

      # The 3-10 minute window overlaps the etcd-maintenance CronJob (every 5
      # minutes), so routine defrags fired this alert. Count starts per member
      # and alert when the busiest member starts nearly every CronJob run
      # (>= 10 of the 12 possible per hour) for 30 minutes.
      - alert: EtcdCustomDefragOccurred
        expr: |
          max by (source_cluster) (
            count_over_time(
              (
                (etcd_disk_defrag_inflight > 0)
                unless
                (etcd_disk_defrag_inflight offset 1m > 0)
              )[1h:1m]
            )
          ) >= 10
        for: 30m
        labels:
          severity: warning
          component: etcd
        annotations:
          summary: >-
            Custom etcd defrag is looping without reclaiming space
          description: >-
            The busiest etcd member started defragmentation at least 10 times per hour for the past 30 minutes in cluster {{ $labels.source_cluster }}.
          alert_routing_key: infra
          team: konflux-infra
          runbook_url: https://gitlab.cee.redhat.com/konflux/docs/sop/-/blob/main/infra/etcd.md

      - alert: EtcdDefragFrequent
        expr: |
          sum by (source_cluster) (etcd_disk_defrag_inflight) > 0
          and
          sum by (source_cluster) (max_over_time(etcd_disk_defrag_inflight[20m] offset 10m)) > 0
        for: 1m
        labels:
          severity: warning
          component: etcd
        annotations:
          summary: >-
            Etcd defragmentation is happening too frequently
          description: >-
            Etcd defragmentation occurred more than once in the last 30 minutes in cluster {{ $labels.source_cluster }}.
          alert_routing_key: infra
          team: konflux-infra
          runbook_url: https://gitlab.cee.redhat.com/konflux/docs/sop/-/blob/main/infra/etcd.md
