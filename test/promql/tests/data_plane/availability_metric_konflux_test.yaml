evaluation_interval: 1m

rule_files:
  - prometheus.availability_metric_konflux_alerts.yaml

tests:
  # Test 1: 3+ services disappear simultaneously – fires after for:30m
  #
  # Samples present at t=0m–59m; absent from t=60m onward.
  # count_over_time[10m] drops to 0 at t=70m (last sample t=59m leaves the 10m window).
  # count_over_time[2h] stays > 0 until t=179m, giving a 109m window well clear of for:30m.
  # Inner expression becomes true at t=70m; for:30m means the alert fires at t=100m.
  - interval: 1m
    input_series:
      - series: 'konflux_up{service="grafana", check="probe", namespace="appstudio-grafana", source_cluster="stone-stg-rh01"}'
        values: '1x59 _x61'
      - series: 'konflux_up{service="svc-b", check="probe", namespace="ns-b", source_cluster="stone-stg-rh01"}'
        values: '1x59 _x61'
      - series: 'konflux_up{service="svc-c", check="probe", namespace="ns-c", source_cluster="stone-stg-rh01"}'
        values: '1x59 _x61'
      # This cluster has no missing series and must not appear in the alert.
      - series: 'konflux_up{service="svc-d", check="probe", namespace="ns-d", source_cluster="stone-stg-m01"}'
        values: '1x120'

    alert_rule_test:
      # At t=99m: 29m elapsed since expression became true – still pending, no alert.
      - eval_time: 99m
        alertname: KonfluxAlert

      # At t=100m: 30m elapsed – alert fires for stone-stg-rh01 only.
      - eval_time: 100m
        alertname: KonfluxAlert
        exp_alerts:
          - exp_labels:
              severity: warning
              slo: "false"
              component: o11y
              source_cluster: stone-stg-rh01
            exp_annotations:
              team: o11y
              summary: >-
                Availability metric 'konflux_up' is missing on cluster stone-stg-rh01.
              description: >-
                3 or more availability metrics on cluster stone-stg-rh01 have not reported
                in the last 10 minutes but were seen in the last 2 hours. This likely indicates a monitoring
                pipeline disruption rather than individual service failures. Note: isolated single-service
                absences are not detected by this rule by design; the cardinality threshold suppresses
                false positives from platform-wide scrape gaps.
              alert_routing_key: 'o11y'

  # Test 2: Fewer than 3 services disappear – cardinality guard suppresses the alert
  - interval: 1m
    input_series:
      - series: 'konflux_up{service="svc-a", check="probe", namespace="ns", source_cluster="cluster01"}'
        values: '1x60 _x60'
      - series: 'konflux_up{service="svc-b", check="probe", namespace="ns", source_cluster="cluster01"}'
        values: '1x60 _x60'

    alert_rule_test:
      - eval_time: 100m
        alertname: KonfluxAlert

  # Test 3: Alert resolves once samples leave the 2h lookback window
  # Three series used to isolate the lookback boundary from the cardinality guard.
  # Last sample at t=5m; count_over_time[2h] drops to 0 at t=126m, so the alert
  # fires between ~t=46m and t=125m then self-resolves. Eval at t=130m confirms
  # the alert is gone once all samples have aged out of the 2h window.
  - interval: 1m
    input_series:
      - series: 'konflux_up{service="svc-a", check="probe", namespace="ns", source_cluster="cluster02"}'
        values: '1x5 _x145'
      - series: 'konflux_up{service="svc-b", check="probe", namespace="ns", source_cluster="cluster02"}'
        values: '1x5 _x145'
      - series: 'konflux_up{service="svc-c", check="probe", namespace="ns", source_cluster="cluster02"}'
        values: '1x5 _x145'

    alert_rule_test:
      - eval_time: 130m
        alertname: KonfluxAlert

  # Test 4: Metrics remain continuously present – never fires
  - interval: 1m
    input_series:
      - series: 'konflux_up{service="grafana", check="probe", namespace="ns", source_cluster="stone-stg-rh01"}'
        values: '1x120'
      - series: 'konflux_up{service="svc-b", check="probe", namespace="ns", source_cluster="stone-stg-rh01"}'
        values: '1x120'
      - series: 'konflux_up{service="svc-c", check="probe", namespace="ns", source_cluster="stone-stg-rh01"}'
        values: '1x120'

    alert_rule_test:
      - eval_time: 100m
        alertname: KonfluxAlert

  # Test 5: One service/check pair missing across 3 namespaces counts as 1, not 3 – no alert
  # Regression for the namespace-inflation bug: without group by (service, check, source_cluster)
  # a single pair in N namespaces could satisfy the > 2 guard by itself.
  - interval: 1m
    input_series:
      - series: 'konflux_up{service="svc-a", check="probe", namespace="ns1", source_cluster="cluster03"}'
        values: '1x59 _x61'
      - series: 'konflux_up{service="svc-a", check="probe", namespace="ns2", source_cluster="cluster03"}'
        values: '1x59 _x61'
      - series: 'konflux_up{service="svc-a", check="probe", namespace="ns3", source_cluster="cluster03"}'
        values: '1x59 _x61'

    alert_rule_test:
      - eval_time: 100m
        alertname: KonfluxAlert

  # Test 6: Namespace isolation – 3 distinct services absent in ns-1 but present in ns-2
  # on the same cluster must still fire: presence in ns-2 must not mask absence in ns-1.
  - interval: 1m
    input_series:
      # ns-1: 3 distinct services stop reporting after t=59m
      - series: 'konflux_up{service="svc-a", check="probe", namespace="ns-1", source_cluster="cluster04"}'
        values: '1x59 _x61'
      - series: 'konflux_up{service="svc-b", check="probe", namespace="ns-1", source_cluster="cluster04"}'
        values: '1x59 _x61'
      - series: 'konflux_up{service="svc-c", check="probe", namespace="ns-1", source_cluster="cluster04"}'
        values: '1x59 _x61'
      # ns-2: same services on same cluster, still reporting throughout
      - series: 'konflux_up{service="svc-a", check="probe", namespace="ns-2", source_cluster="cluster04"}'
        values: '1x120'
      - series: 'konflux_up{service="svc-b", check="probe", namespace="ns-2", source_cluster="cluster04"}'
        values: '1x120'
      - series: 'konflux_up{service="svc-c", check="probe", namespace="ns-2", source_cluster="cluster04"}'
        values: '1x120'

    alert_rule_test:
      - eval_time: 100m
        alertname: KonfluxAlert
        exp_alerts:
          - exp_labels:
              severity: warning
              slo: "false"
              component: o11y
              source_cluster: cluster04
            exp_annotations:
              team: o11y
              summary: >-
                Availability metric 'konflux_up' is missing on cluster cluster04.
              description: >-
                3 or more availability metrics on cluster cluster04 have not reported
                in the last 10 minutes but were seen in the last 2 hours. This likely indicates a monitoring
                pipeline disruption rather than individual service failures. Note: isolated single-service
                absences are not detected by this rule by design; the cardinality threshold suppresses
                false positives from platform-wide scrape gaps.
              alert_routing_key: 'o11y'
