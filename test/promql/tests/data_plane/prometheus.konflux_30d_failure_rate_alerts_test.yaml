evaluation_interval: 5m

rule_files:
  - "prometheus.konflux_30d_failure_rate_alerts.yaml"

tests:
  # Integration: only non-EC runs failing for reasons other than Failed/Cancelled count.
  - interval: 5m
    input_series:
      # cluster-1: 200 non-EC runs, 40 CouldntGetTask + 60 Failed + 20 Cancelled -> 20% unexplained
      - series: 'konflux_integration_total_count_30d{source_cluster="cluster-1", test_type="integration"}'
        values: '200x24'
      - series: 'konflux_integration_failure_count_30d{source_cluster="cluster-1", test_type="integration", reason="CouldntGetTask"}'
        values: '40x24'
      - series: 'konflux_integration_failure_count_30d{source_cluster="cluster-1", test_type="integration", reason="Failed"}'
        values: '60x24'
      - series: 'konflux_integration_failure_count_30d{source_cluster="cluster-1", test_type="integration", reason="Cancelled"}'
        values: '20x24'
      # EC runs on cluster-1 are ignored: 1000 runs, 900 PipelineRunTimeout would otherwise dominate
      - series: 'konflux_integration_total_count_30d{source_cluster="cluster-1", test_type="ec"}'
        values: '1000x24'
      - series: 'konflux_integration_failure_count_30d{source_cluster="cluster-1", test_type="ec", reason="PipelineRunTimeout"}'
        values: '900x24'
      # cluster-2: 90% plain test failures, 5% unexplained -> below threshold
      - series: 'konflux_integration_total_count_30d{source_cluster="cluster-2", test_type="integration"}'
        values: '200x24'
      - series: 'konflux_integration_failure_count_30d{source_cluster="cluster-2", test_type="integration", reason="Failed"}'
        values: '180x24'
      - series: 'konflux_integration_failure_count_30d{source_cluster="cluster-2", test_type="integration", reason="PipelineRunTimeout"}'
        values: '10x24'
      # cluster-3: 100% unexplained but only 50 runs -> volume guard
      - series: 'konflux_integration_total_count_30d{source_cluster="cluster-3", test_type="integration"}'
        values: '50x24'
      - series: 'konflux_integration_failure_count_30d{source_cluster="cluster-3", test_type="integration", reason="CouldntGetPipeline"}'
        values: '50x24'
    alert_rule_test:
      - eval_time: 30m
        alertname: KonfluxIntegrationUnexplainedFailureRate30dHigh
        exp_alerts: []
      - eval_time: 70m
        alertname: KonfluxIntegrationUnexplainedFailureRate30dHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              slo: "false"
              component: konflux-integration
              source_cluster: cluster-1
            exp_annotations:
              summary: >-
                High rate of unexplained integration test failures in cluster cluster-1
              description: >-
                20% of integration test PipelineRuns (excluding EC) on cluster cluster-1
                failed over the last 30 days for a reason other than the test itself failing or being cancelled, above the 15% threshold.
                Check the failure reasons in konflux_integration_failure_count_30d.
              team: konflux-spre
              alert_routing_key: "<!subteam^S05M4AG8CJH> <!subteam^S06V06A36F5>"
              runbook_url: https://gitlab.cee.redhat.com/konflux/docs/sop/-/blob/main/o11y/alerting/alert-rules/alert-rule-KonfluxFailureRate30dHigh.md

  # Release: a spike well above the 7-day baseline fires.
  # 5m steps: 7 days at 10% failing, then 8 hours at 60% failing, 10 releases per 5m.
  - interval: 5m
    input_series:
      - series: 'release_total{source_cluster="cluster-1", validation_reason="Succeeded", release_reason="Succeeded"}'
        values: '0+9x2016 18144+4x96'
      - series: 'release_total{source_cluster="cluster-1", validation_reason="Succeeded", release_reason="Failed"}'
        values: '0+1x2016 2016+6x96'
    alert_rule_test:
      - eval_time: 10080m
        alertname: KonfluxReleaseFailureRateSpike
        exp_alerts: []
      - eval_time: 10560m
        alertname: KonfluxReleaseFailureRateSpike
        exp_alerts:
          - exp_labels:
              severity: warning
              slo: "false"
              component: konflux-release
              source_cluster: cluster-1
            exp_annotations:
              summary: >-
                Release failure rate spiked in cluster cluster-1
              description: >-
                On cluster cluster-1, the share of releases failing after validation over the last 6 hours
                exceeds its 7-day average by 47.64% (percentage points).
              team: konflux-spre
              alert_routing_key: "<!subteam^S09N535GS4E> <!subteam^S06V06A36F5>"
              runbook_url: https://gitlab.cee.redhat.com/konflux/docs/sop/-/blob/main/o11y/alerting/alert-rules/alert-rule-KonfluxFailureRate30dHigh.md

  # Release: a steady high failure rate is the baseline and does not fire.
  - interval: 5m
    input_series:
      - series: 'release_total{source_cluster="cluster-1", validation_reason="Succeeded", release_reason="Succeeded"}'
        values: '0+6x2112'
      - series: 'release_total{source_cluster="cluster-1", validation_reason="Succeeded", release_reason="Failed"}'
        values: '0+4x2112'
    alert_rule_test:
      - eval_time: 10560m
        alertname: KonfluxReleaseFailureRateSpike
        exp_alerts: []

  # Release: a spike on low volume (under 50 releases in 6h) does not fire.
  - interval: 5m
    input_series:
      - series: 'release_total{source_cluster="cluster-1", validation_reason="Succeeded", release_reason="Succeeded"}'
        values: '0+0x2112'
      - series: 'release_total{source_cluster="cluster-1", validation_reason="Succeeded", release_reason="Failed"}'
        values: '0+0x2016 0+0.5x96'
    alert_rule_test:
      - eval_time: 10560m
        alertname: KonfluxReleaseFailureRateSpike
        exp_alerts: []
