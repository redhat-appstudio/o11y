evaluation_interval: 1m

rule_files:
  - prometheus.pod_alerts.yaml

tests:
  - interval: 1m
    input_series:

      # Initially pod is unscheduled but later status changed to scheduled so it's not alerted
      - series: 'kube_pod_status_unschedulable{namespace="prod", pod="prod-pod-1", source_cluster="cluster01"}'
        values: '1x40 0x20'

      # The pod is in unscheduled status whole time, so this is alerted
      - series: 'kube_pod_status_unschedulable{namespace="prod-test", pod="prod-pod-2", source_cluster="cluster02"}'
        values: '1x60'

      # The pod is unscheduled most of the time but there is some window where pod is scheduled so it's not alerted
      - series: 'kube_pod_status_unschedulable{namespace="prod-test", pod="prod-pod-3", source_cluster="cluster03"}'
        values: '1x29 0 1x28'

      # The pod is in unscheduled status whole time but the namespace ends with tenant so it's ignored
      - series: 'kube_pod_status_unschedulable{namespace="prod-tenant", pod="prod-pod-3", source_cluster="cluster04"}'
        values: '1x60'

      # The pod is in unscheduled status whole time but the namespace starts with openshift so it's ignored
      - series: 'kube_pod_status_unschedulable{namespace="openshift-prod-test", pod="oc-pod", source_cluster="cluster05"}'
        values: '1x60'

      # The pod is in unscheduled status whole time but the namespace starts with kube so it's ignored
      - series: 'kube_pod_status_unschedulable{namespace="kube-test", pod="kube-pod", source_cluster="cluster06"}'
        values: '1x60'

      # The pod is in unscheduled status whole time but the namespace is default so it's ignored
      - series: 'kube_pod_status_unschedulable{namespace="default", pod="test-pod", source_cluster="cluster07"}'
        values: '1x60'

      # The pod is in unscheduled status whole time but the namespace ends with env so it's ignored
      - series: 'kube_pod_status_unschedulable{namespace="test-env", pod="test-pod", source_cluster="cluster01"}'
        values: '1x60'

      # The pod is in unscheduled status whole time but it's in the 'tekton-ci' namespace so it's ignored
      - series: 'kube_pod_status_unschedulable{namespace="tekton-ci", pod="test-pod", source_cluster="cluster01"}'
        values: '1x60'

      # The pod is in unscheduled status whole time but it's in the 'build-templates-e2e' namespace so it's ignored
      - series: 'kube_pod_status_unschedulable{namespace="build-templates-e2e", pod="test-pod", source_cluster="cluster01"}'
        values: '1x60'

      # proactive-scaler balloon pods — intentionally unschedulable by design, ignored
      - series: 'kube_pod_status_unschedulable{namespace="proactive-scaler", pod="m6i-8xlarge-abc-xyz", source_cluster="kflux-osp-p01"}'
        values: '1x60'

      # HyperShift hosted-cluster UUID namespace — ephemeral EaaS lifecycle, ignored
      - series: 'kube_pod_status_unschedulable{namespace="clusters-1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d", pod="capi-provider-pod", source_cluster="kflux-prd-es01"}'
        values: '1x60'

      # HyperShift clusters namespace — ephemeral EaaS lifecycle, ignored
      - series: 'kube_pod_status_unschedulable{namespace="clusters", pod="cluster-create-job", source_cluster="kflux-prd-es01"}'
        values: '1x60'

      # EaaS provision-namespace namespace — transient CI/test pod, ignored
      - series: 'kube_pod_status_unschedulable{namespace="my-app-provision-namespace-eaas", pod="provision-pod", source_cluster="kflux-ocp-p01"}'
        values: '1x60'

      # EaaS provision-eaas-space namespace — transient CI/test pod, ignored
      - series: 'kube_pod_status_unschedulable{namespace="my-app-provision-eaas-space-abc123", pod="eaas-space-pod", source_cluster="kflux-ocp-p01"}'
        values: '1x60'

      # EaaS provision-env namespace — transient CI/test pod, ignored
      - series: 'kube_pod_status_unschedulable{namespace="my-app-provision-env-dev", pod="env-provision-pod", source_cluster="kflux-ocp-p01"}'
        values: '1x60'

      # EaaS ephemeral deploy namespace — transient CI/test pod, ignored
      - series: 'kube_pod_status_unschedulable{namespace="ci-test-deploy-ephemeral-run1", pod="deploy-pod", source_cluster="kflux-ocp-p01"}'
        values: '1x60'

      # min_over_time: pod unschedulable 25m then explicitly recovers (value=0) and stays recovered.
      # Series remains present through evaluation to prove absence is not causing the test to pass.
      - series: 'kube_pod_status_unschedulable{namespace="prod", pod="recovered-pod", source_cluster="cluster08"}'
        values: '1x25 0x35'

    alert_rule_test:
      - eval_time: 60m
        alertname: UnschedulablePods
        exp_alerts:
          - exp_labels:
              severity: warning
              slo: "false"
              team: o11y
              component: kube-state-metrics
              namespace: prod-test
              pod: prod-pod-2
              source_cluster: cluster02
            exp_annotations:
              summary: Pod prod-test/prod-pod-2 on cluster02 cannot be scheduled.
              description: >-
                Pod prod-pod-2 for namespace prod-test on cluster cluster02 is
                unscheduled for more than 30 minutes.
              alert_routing_key: prod-test
              runbook_url: https://gitlab.cee.redhat.com/konflux/docs/sop/-/blob/main/o11y/alerting/alert-rules/alert-rule-unschedualablePods.md
