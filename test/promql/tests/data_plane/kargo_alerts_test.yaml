evaluation_interval: 1m

rule_files:
  - prometheus.kargo_alerts.yaml

tests:
  - interval: 1m
    input_series:
      # Infra shard: sustained reconciliation errors
      - series: 'controller_runtime_reconcile_errors_total{job="kargo-controller-metrics",namespace="kargo-shard-infra-deployments-production",controller="stages",source_cluster="kflux-c-prd-i01"}'
        values: '0+1x60'

      # Main Kargo namespace: should not trigger this alert
      - series: 'controller_runtime_reconcile_errors_total{job="kargo-controller-metrics",namespace="kargo",controller="stages",source_cluster="kflux-c-prd-i01"}'
        values: '0+1x60'

      # Infra shard: no reconciliation errors
      - series: 'controller_runtime_reconcile_errors_total{job="kargo-controller-metrics",namespace="kargo-shard-infra-deployments-production",controller="warehouses",source_cluster="kflux-c-prd-i01"}'
        values: '0x60'

    alert_rule_test:
      - eval_time: 30m
        alertname: KargoInfraShardReconcileErrors
        exp_alerts:
          - exp_labels:
              severity: warning
              component: kargo
              slo: "false"
              namespace: kargo-shard-infra-deployments-production
              controller: stages
              source_cluster: kflux-c-prd-i01
            exp_annotations:
              summary: Kargo infrastructure shard reconciliation errors in kflux-c-prd-i01
              description: >-
                Kargo controller stages in namespace
                kargo-shard-infra-deployments-production has experienced more
                than 5 reconciliation errors in 15 minutes, sustained
                for 10 minutes. This may impact infrastructure
                and ring deployments.
              alert_routing_key: spreandinfra

      # Before the 10-minute 'for' duration completes
      - eval_time: 15m
        alertname: KargoInfraShardReconcileErrors
        exp_alerts: []

  # Layer 1: Kargo controller availability
  - interval: 1m
    input_series:
      # Main Kargo controller unavailable
      - series: 'konflux_up{namespace="kargo",service="kargo-controller",check="replicas-available",source_cluster="kflux-c-prd-i01"}'
        values: '0x40'

      # Infrastructure shard controller unavailable
      - series: 'konflux_up{namespace="kargo-shard-infra-deployments-production",service="kargo-controller",check="replicas-available",source_cluster="kflux-c-prd-i01"}'
        values: '0x40'

      # Staging infrastructure shard controller unavailable
      - series: 'konflux_up{namespace="kargo-shard-infra-deployments",service="kargo-controller",check="replicas-available",source_cluster="kflux-c-stg-i01"}'
        values: '0x40'

      # Healthy unrelated deployment
      - series: 'konflux_up{namespace="kargo",service="kargo-api",check="replicas-available",source_cluster="kflux-c-prd-i01"}'
        values: '1x40'

    alert_rule_test:
      # Both controllers should fire after 15 minutes
      - eval_time: 20m
        alertname: KargoDeploymentUnavailable
        exp_alerts:
          - exp_labels:
              namespace: kargo
              service: kargo-controller
              check: replicas-available
              source_cluster: kflux-c-prd-i01
              severity: critical
              slo: "true"
              component: kargo
            exp_annotations:
              html_url: https://github.com/redhat-appstudio/o11y/blob/main/rhobs/alerting/data_plane/prometheus.kargo_alerts.yaml#L39
              runbook_url: https://gitlab.cee.redhat.com/konflux/docs/sop/-/blob/main/infra/sre/alert-KargoDeploymentUnavailable.md
              summary: Kargo controller unavailable in kflux-c-prd-i01
              description: >-
                Kargo controller in namespace kargo
                has been unavailable for 15 minutes in cluster
                kflux-c-prd-i01.
              alert_team_handle: '<!subteam^S07SW2EEW3D> <!subteam^S05Q1P4Q2TG>'
              team: konflux-infra

          - exp_labels:
              namespace: kargo-shard-infra-deployments-production
              service: kargo-controller
              check: replicas-available
              source_cluster: kflux-c-prd-i01
              severity: critical
              slo: "true"
              component: kargo
            exp_annotations:
              html_url: https://github.com/redhat-appstudio/o11y/blob/main/rhobs/alerting/data_plane/prometheus.kargo_alerts.yaml#L39
              runbook_url: https://gitlab.cee.redhat.com/konflux/docs/sop/-/blob/main/infra/sre/alert-KargoDeploymentUnavailable.md
              summary: Kargo controller unavailable in kflux-c-prd-i01
              description: >-
                Kargo controller in namespace kargo-shard-infra-deployments-production
                has been unavailable for 15 minutes in cluster
                kflux-c-prd-i01.
              alert_team_handle: '<!subteam^S07SW2EEW3D> <!subteam^S05Q1P4Q2TG>'
              team: konflux-infra

          - exp_labels:
              namespace: kargo-shard-infra-deployments
              service: kargo-controller
              check: replicas-available
              source_cluster: kflux-c-stg-i01
              severity: critical
              slo: "true"
              component: kargo
            exp_annotations:
              html_url: https://github.com/redhat-appstudio/o11y/blob/main/rhobs/alerting/data_plane/prometheus.kargo_alerts.yaml#L39
              runbook_url: https://gitlab.cee.redhat.com/konflux/docs/sop/-/blob/main/infra/sre/alert-KargoDeploymentUnavailable.md
              summary: Kargo controller unavailable in kflux-c-stg-i01
              description: >-
                Kargo controller in namespace kargo-shard-infra-deployments
                has been unavailable for 15 minutes in cluster
                kflux-c-stg-i01.
              alert_team_handle: '<!subteam^S07SW2EEW3D> <!subteam^S05Q1P4Q2TG>'
              team: konflux-infra

      # Before the 15-minute duration completes
      - eval_time: 10m
        alertname: KargoDeploymentUnavailable
        exp_alerts: []

  # Layer 3: Kargo promotion failure
  - interval: 1m
    input_series:
      - series: 'kargo:stage:last_promotion:finished_timestamp{exported_namespace="kargo-konflux-infrastructure",component="etcd-shield",stage="ring-1",phase="Failed"}'
        values: '600x45'

    alert_rule_test:
      # Failed promotion is recent and the 2-minute pending period has passed
      - eval_time: 15m
        alertname: KargoPromotionFailed
        exp_alerts:
          - exp_labels:
              exported_namespace: kargo-konflux-infrastructure
              component: kargo
              kargo_component: etcd-shield
              stage: ring-1
              severity: critical
              slo: "true"
            exp_annotations:
              html_url: https://github.com/redhat-appstudio/o11y/blob/main/rhobs/alerting/data_plane/prometheus.kargo_alerts.yaml
              summary: "Kargo promotion failed: etcd-shield / ring-1"
              description: >-
                A recent Kargo promotion failed or errored in namespace
                kargo-konflux-infrastructure.
              alert_team_handle: '<!subteam^S07SW2EEW3D> <!subteam^S05Q1P4Q2TG>'
              team: konflux-infra
              runbook_url: https://gitlab.cee.redhat.com/konflux/docs/sop/-/blob/main/infra/sre/alert-KargoPromotionFailed.md

      # Failure timestamp is outside the 30-minute detection window
      - eval_time: 41m
        alertname: KargoPromotionFailed
        exp_alerts: []

  # Layer 3: Newer successful promotion suppresses failure alert
  - interval: 1m
    input_series:
      - series: 'kargo:stage:last_promotion:finished_timestamp{exported_namespace="kargo-konflux-infrastructure",component="etcd-shield",stage="ring-1",phase="Failed"}'
        values: '600x45'

      - series: 'kargo:stage:last_promotion:finished_timestamp{exported_namespace="kargo-konflux-infrastructure",component="etcd-shield",stage="ring-1",phase="Succeeded"}'
        values: '720x45'

    alert_rule_test:
      - eval_time: 15m
        alertname: KargoPromotionFailed
        exp_alerts: []

  # Layer 3: Errored promotion triggers Critical alert
  - interval: 1m
    input_series:
      - series: 'kargo:stage:last_promotion:finished_timestamp{exported_namespace="kargo-konflux-infrastructure",component="etcd-shield",stage="ring-1",phase="Errored"}'
        values: '600x45'

    alert_rule_test:
      - eval_time: 15m
        alertname: KargoPromotionFailed
        exp_alerts:
          - exp_labels:
              exported_namespace: kargo-konflux-infrastructure
              component: kargo
              kargo_component: etcd-shield
              stage: ring-1
              severity: critical
              slo: "true"
            exp_annotations:
              html_url: https://github.com/redhat-appstudio/o11y/blob/main/rhobs/alerting/data_plane/prometheus.kargo_alerts.yaml
              summary: "Kargo promotion failed: etcd-shield / ring-1"
              description: >-
                A recent Kargo promotion failed or errored in namespace
                kargo-konflux-infrastructure.
              alert_team_handle: '<!subteam^S07SW2EEW3D> <!subteam^S05Q1P4Q2TG>'
              team: konflux-infra
              runbook_url: https://gitlab.cee.redhat.com/konflux/docs/sop/-/blob/main/infra/sre/alert-KargoPromotionFailed.md

  # Layer 3: Kargo auto-promotion hold exceeds 24 hours
  - interval: 1m
    input_series:
      # Production hold older than 24 hours
      - series: 'kargo:stage:effective_auto_promotion_hold:created_timestamp{exported_namespace="kargo-konflux-infrastructure",component="etcd-shield",stage="ring-1",origin_kind="Promotion",origin_name="test-promotion"}'
        values: '0x1500'

      # Playground hold must be excluded
      - series: 'kargo:stage:effective_auto_promotion_hold:created_timestamp{exported_namespace="kargo-production-playground",component="dummy-deployment",stage="ring-1",origin_kind="Promotion",origin_name="test-promotion"}'
        values: '0x1500'

    alert_rule_test:
      # Hold is younger than 24 hours
      - eval_time: 23h
        alertname: KargoAutoPromotionHoldTooLong
        exp_alerts: []

      # Hold exceeds 24 hours and the 5-minute pending period has passed
      - eval_time: 24h10m
        alertname: KargoAutoPromotionHoldTooLong
        exp_alerts:
          - exp_labels:
              exported_namespace: kargo-konflux-infrastructure
              component: kargo
              kargo_component: etcd-shield
              stage: ring-1
              origin_kind: Promotion
              origin_name: test-promotion
              severity: warning
              slo: "false"
            exp_annotations:
              html_url: https://github.com/redhat-appstudio/o11y/blob/main/rhobs/alerting/data_plane/prometheus.kargo_alerts.yaml
              summary: "Kargo auto-promotion hold exceeds 24h: etcd-shield / ring-1"
              description: >-
                Auto-promotion hold timestamp is older than 24 hours in
                kargo-konflux-infrastructure.
              alert_routing_key: spreandinfra
