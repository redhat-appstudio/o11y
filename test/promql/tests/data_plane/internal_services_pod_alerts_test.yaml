evaluation_interval: 1m

rule_files:
  - prometheus.internal_services_pod_alerts.yaml

tests:
  # ---- InternalServicesHighPodFailureCount ----

  - name: HighPodFailureCountAlerts
    interval: 1m
    input_series:
      # 21 pods in Failed state - should alert (threshold > 20)
      - series: 'kube_pod_status_phase{pod="signing-pod-01", namespace="internal-services", phase="Failed", source_cluster="cluster01"}'
        values: '1x29'
      - series: 'kube_pod_status_phase{pod="signing-pod-02", namespace="internal-services", phase="Failed", source_cluster="cluster01"}'
        values: '1x29'
      - series: 'kube_pod_status_phase{pod="signing-pod-03", namespace="internal-services", phase="Failed", source_cluster="cluster01"}'
        values: '1x29'
      - series: 'kube_pod_status_phase{pod="signing-pod-04", namespace="internal-services", phase="Failed", source_cluster="cluster01"}'
        values: '1x29'
      - series: 'kube_pod_status_phase{pod="signing-pod-05", namespace="internal-services", phase="Failed", source_cluster="cluster01"}'
        values: '1x29'
      - series: 'kube_pod_status_phase{pod="signing-pod-06", namespace="internal-services", phase="Failed", source_cluster="cluster01"}'
        values: '1x29'
      - series: 'kube_pod_status_phase{pod="signing-pod-07", namespace="internal-services", phase="Failed", source_cluster="cluster01"}'
        values: '1x29'
      - series: 'kube_pod_status_phase{pod="signing-pod-08", namespace="internal-services", phase="Failed", source_cluster="cluster01"}'
        values: '1x29'
      - series: 'kube_pod_status_phase{pod="signing-pod-09", namespace="internal-services", phase="Failed", source_cluster="cluster01"}'
        values: '1x29'
      - series: 'kube_pod_status_phase{pod="signing-pod-10", namespace="internal-services", phase="Failed", source_cluster="cluster01"}'
        values: '1x29'
      - series: 'kube_pod_status_phase{pod="signing-pod-11", namespace="internal-services", phase="Failed", source_cluster="cluster01"}'
        values: '1x29'
      - series: 'kube_pod_status_phase{pod="signing-pod-12", namespace="internal-services", phase="Failed", source_cluster="cluster01"}'
        values: '1x29'
      - series: 'kube_pod_status_phase{pod="signing-pod-13", namespace="internal-services", phase="Failed", source_cluster="cluster01"}'
        values: '1x29'
      - series: 'kube_pod_status_phase{pod="signing-pod-14", namespace="internal-services", phase="Failed", source_cluster="cluster01"}'
        values: '1x29'
      - series: 'kube_pod_status_phase{pod="signing-pod-15", namespace="internal-services", phase="Failed", source_cluster="cluster01"}'
        values: '1x29'
      - series: 'kube_pod_status_phase{pod="signing-pod-16", namespace="internal-services", phase="Failed", source_cluster="cluster01"}'
        values: '1x29'
      - series: 'kube_pod_status_phase{pod="signing-pod-17", namespace="internal-services", phase="Failed", source_cluster="cluster01"}'
        values: '1x29'
      - series: 'kube_pod_status_phase{pod="signing-pod-18", namespace="internal-services", phase="Failed", source_cluster="cluster01"}'
        values: '1x29'
      - series: 'kube_pod_status_phase{pod="signing-pod-19", namespace="internal-services", phase="Failed", source_cluster="cluster01"}'
        values: '1x29'
      - series: 'kube_pod_status_phase{pod="signing-pod-20", namespace="internal-services", phase="Failed", source_cluster="cluster01"}'
        values: '1x29'
      - series: 'kube_pod_status_phase{pod="signing-pod-21", namespace="internal-services", phase="Failed", source_cluster="cluster01"}'
        values: '1x29'
    alert_rule_test:
      - eval_time: 30m
        alertname: InternalServicesHighPodFailureCount
        exp_alerts:
          - exp_labels:
              severity: warning
              component: internal-services
              source_cluster: cluster01
              namespace: internal-services
            exp_annotations:
              summary: >-
                High number of failed pods in internal-services namespace
              description: >-
                More than 20 non-Job pods in namespace internal-services on
                cluster cluster01 are in a non-ready state for
                more than 30 minutes. This may indicate a systemic issue with
                signing workflows or resource constraints.
              alert_routing_key: internal-services
              runbook_url: https://gitlab.cee.redhat.com/konflux/docs/sop/-/blob/main/o11y/alerting/alert-rules/alert-rule-PodNotReady.md
              team: release

  - name: BelowThresholdDoesNotAlert
    interval: 1m
    input_series:
      # 5 pods in Failed state - should NOT alert (below threshold of 20)
      - series: 'kube_pod_status_phase{pod="signing-pod-01", namespace="internal-services", phase="Failed", source_cluster="cluster01"}'
        values: '1x29'
      - series: 'kube_pod_status_phase{pod="signing-pod-02", namespace="internal-services", phase="Failed", source_cluster="cluster01"}'
        values: '1x29'
      - series: 'kube_pod_status_phase{pod="signing-pod-03", namespace="internal-services", phase="Failed", source_cluster="cluster01"}'
        values: '1x29'
      - series: 'kube_pod_status_phase{pod="signing-pod-04", namespace="internal-services", phase="Failed", source_cluster="cluster01"}'
        values: '1x29'
      - series: 'kube_pod_status_phase{pod="signing-pod-05", namespace="internal-services", phase="Failed", source_cluster="cluster01"}'
        values: '1x29'
    alert_rule_test:
      - eval_time: 30m
        alertname: InternalServicesHighPodFailureCount
        exp_alerts: []
