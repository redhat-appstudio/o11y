evaluation_interval: 1m

rule_files:
  - konflux_mttb_recording_rules.yaml

tests:
  - name: ExecuteMean
    interval: 1m
    input_series:
      - series: "traces_span_metrics_duration_seconds_sum{span_name='executeDuration', cicd_pipeline_action_name='build', cicd_pipeline_result='success', exported_namespace='team-a', source_cluster='cluster-a'}"
        values: "0+120x10"
      - series: "traces_span_metrics_duration_seconds_count{span_name='executeDuration', cicd_pipeline_action_name='build', cicd_pipeline_result='success', exported_namespace='team-a', source_cluster='cluster-a'}"
        values: "0+1x10"
    promql_expr_test:
      - expr: konflux:mttb:execute_seconds:mean_5m
        eval_time: 10m
        exp_samples:
          - labels: 'konflux:mttb:execute_seconds:mean_5m{cicd_pipeline_action_name="build", exported_namespace="team-a", source_cluster="cluster-a"}'
            value: 120
  - name: SuccessRatio
    interval: 1m
    input_series:
      - series: "traces_span_metrics_calls_total{span_name='executeDuration', cicd_pipeline_action_name='build', cicd_pipeline_result='success', exported_namespace='team-a', source_cluster='cluster-a'}"
        values: "0+3x10"
      - series: "traces_span_metrics_calls_total{span_name='executeDuration', cicd_pipeline_action_name='build', cicd_pipeline_result='failure', exported_namespace='team-a', source_cluster='cluster-a'}"
        values: "0+1x10"
    promql_expr_test:
      - expr: konflux:mttb:success_ratio:5m{cicd_pipeline_action_name="build"}
        eval_time: 10m
        exp_samples:
          - labels: 'konflux:mttb:success_ratio:5m{cicd_pipeline_action_name="build", exported_namespace="team-a", source_cluster="cluster-a"}'
            value: 0.75
  - name: ExecuteP95
    interval: 1m
    input_series:
      - series: "traces_span_metrics_duration_seconds_bucket{span_name='executeDuration', cicd_pipeline_action_name='build', cicd_pipeline_result='success', exported_namespace='team-a', source_cluster='cluster-a', le='100'}"
        values: "0+20x10"
      - series: "traces_span_metrics_duration_seconds_bucket{span_name='executeDuration', cicd_pipeline_action_name='build', cicd_pipeline_result='success', exported_namespace='team-a', source_cluster='cluster-a', le='+Inf'}"
        values: "0+20x10"
    promql_expr_test:
      - expr: konflux:mttb:execute_seconds:p95_5m
        eval_time: 10m
        exp_samples:
          - labels: 'konflux:mttb:execute_seconds:p95_5m{cicd_pipeline_action_name="build", exported_namespace="team-a", source_cluster="cluster-a"}'
            value: 95
  - name: CallsRate
    interval: 1m
    input_series:
      - series: "traces_span_metrics_calls_total{span_name='executeDuration', cicd_pipeline_action_name='build', cicd_pipeline_result='success', exported_namespace='team-a', source_cluster='cluster-a'}"
        values: "0+2x10"
    promql_expr_test:
      - expr: konflux:mttb:calls:rate_5m{cicd_pipeline_action_name="build"}
        eval_time: 10m
        exp_samples:
          - labels: 'konflux:mttb:calls:rate_5m{cicd_pipeline_action_name="build", cicd_pipeline_result="success", exported_namespace="team-a", source_cluster="cluster-a"}'
            value: 0.03333333333333333
  - name: MultiClusterGlobalMean
    interval: 1m
    input_series:
      - series: "traces_span_metrics_duration_seconds_sum{span_name='executeDuration', cicd_pipeline_action_name='build', cicd_pipeline_result='success', exported_namespace='team-a', source_cluster='cluster-a'}"
        values: "0+100x10"
      - series: "traces_span_metrics_duration_seconds_count{span_name='executeDuration', cicd_pipeline_action_name='build', cicd_pipeline_result='success', exported_namespace='team-a', source_cluster='cluster-a'}"
        values: "0+1x10"
      - series: "traces_span_metrics_duration_seconds_sum{span_name='executeDuration', cicd_pipeline_action_name='build', cicd_pipeline_result='success', exported_namespace='team-a', source_cluster='cluster-b'}"
        values: "0+200x10"
      - series: "traces_span_metrics_duration_seconds_count{span_name='executeDuration', cicd_pipeline_action_name='build', cicd_pipeline_result='success', exported_namespace='team-a', source_cluster='cluster-b'}"
        values: "0+1x10"
    promql_expr_test:
      - expr: konflux:mttb:execute_seconds:mean_5m:global
        eval_time: 10m
        exp_samples:
          - labels: 'konflux:mttb:execute_seconds:mean_5m:global{cicd_pipeline_action_name="build", exported_namespace="team-a"}'
            value: 150
  - name: WaitMean
    interval: 1m
    input_series:
      - series: "traces_span_metrics_duration_seconds_sum{span_name='waitDuration', cicd_pipeline_action_name='managed', exported_namespace='team-a', source_cluster='cluster-a'}"
        values: "0+30x10"
      - series: "traces_span_metrics_duration_seconds_count{span_name='waitDuration', cicd_pipeline_action_name='managed', exported_namespace='team-a', source_cluster='cluster-a'}"
        values: "0+1x10"
    promql_expr_test:
      - expr: konflux:mttb:wait_seconds:mean_5m{cicd_pipeline_action_name="managed"}
        eval_time: 10m
        exp_samples:
          - labels: 'konflux:mttb:wait_seconds:mean_5m{cicd_pipeline_action_name="managed", exported_namespace="team-a", source_cluster="cluster-a"}'
            value: 30
