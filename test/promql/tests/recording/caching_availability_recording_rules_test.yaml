evaluation_interval: 1m

rule_files:
- caching_availability_recording_rules.yaml

tests:
  - interval: 1m
    # All replicas up → konflux_up = 1
    input_series:
      - series: 'squid_up{namespace="caching", service="squid", job="uwm/scrape", instance="10.0.0.1:9301", pod="squid-0"}'
        values: '1 1 1'
      - series: 'squid_up{namespace="caching", service="squid", job="uwm/scrape", instance="10.0.0.2:9301", pod="squid-1"}'
        values: '1 1 1'
    promql_expr_test:
      - expr: konflux_up
        eval_time: 2m
        exp_samples:
          - labels: 'konflux_up{namespace="caching", service="squid"}'
            value: 1

  - interval: 1m
    # One replica down → konflux_up = 0 (min across targets)
    input_series:
      - series: 'squid_up{namespace="caching", service="squid", job="uwm/scrape", instance="10.0.0.1:9301", pod="squid-0"}'
        values: '1 1 1'
      - series: 'squid_up{namespace="caching", service="squid", job="uwm/scrape", instance="10.0.0.2:9301", pod="squid-1"}'
        values: '1 0 0'
    promql_expr_test:
      - expr: konflux_up
        eval_time: 2m
        exp_samples:
          - labels: 'konflux_up{namespace="caching", service="squid"}'
            value: 0

  - interval: 1m
    # All replicas up → konflux_up = 1
    input_series:
      - series: 'nginx_up{namespace="caching", service="artifact-registry-proxy", job="uwm/scrape", instance="10.0.0.1:9113", pod="nginx-0"}'
        values: '1 1 1'
      - series: 'nginx_up{namespace="caching", service="artifact-registry-proxy", job="uwm/scrape", instance="10.0.0.2:9113", pod="nginx-1"}'
        values: '1 1 1'
    promql_expr_test:
      - expr: konflux_up
        eval_time: 2m
        exp_samples:
          - labels: 'konflux_up{namespace="caching", service="artifact-registry-proxy"}'
            value: 1

  - interval: 1m
    # One replica down → konflux_up = 0 (min across targets)
    input_series:
      - series: 'nginx_up{namespace="caching", service="artifact-registry-proxy", job="uwm/scrape", instance="10.0.0.1:9113", pod="nginx-0"}'
        values: '1 1 1'
      - series: 'nginx_up{namespace="caching", service="artifact-registry-proxy", job="uwm/scrape", instance="10.0.0.2:9113", pod="nginx-1"}'
        values: '1 0 0'
    promql_expr_test:
      - expr: konflux_up
        eval_time: 2m
        exp_samples:
          - labels: 'konflux_up{namespace="caching", service="artifact-registry-proxy"}'
            value: 0

  - interval: 1m
    # Test artifact_registry_proxy:http_requests:rate5m recording rule
    input_series:
      - series: 'http_requests_total{namespace="caching", service="artifact-registry-proxy", source_cluster="cluster01", status="200"}'
        values: '0+10x10'
      - series: 'http_requests_total{namespace="caching", service="artifact-registry-proxy", source_cluster="cluster01", status="500"}'
        values: '0+5x10'
    promql_expr_test:
      - expr: artifact_registry_proxy:http_requests:rate5m
        eval_time: 6m
        exp_samples:
          - labels: 'artifact_registry_proxy:http_requests:rate5m{namespace="caching", service="artifact-registry-proxy", source_cluster="cluster01"}'
            value: 0.25

  - interval: 1m
    # Test artifact_registry_proxy:http_errors:rate5m recording rule
    input_series:
      - series: 'http_requests_total{namespace="caching", service="artifact-registry-proxy", source_cluster="cluster01", status="200"}'
        values: '0+10x10'
      - series: 'http_requests_total{namespace="caching", service="artifact-registry-proxy", source_cluster="cluster01", status="500"}'
        values: '0+5x10'
    promql_expr_test:
      - expr: artifact_registry_proxy:http_errors:rate5m
        eval_time: 6m
        exp_samples:
          - labels: 'artifact_registry_proxy:http_errors:rate5m{namespace="caching", service="artifact-registry-proxy", source_cluster="cluster01"}'
            value: 0.08333333333333334

  - interval: 1m
    # All replicas up in artifact-registry-proxy namespace → konflux_up = 1
    input_series:
      - series: 'nginx_up{namespace="artifact-registry-proxy", service="artifact-registry-proxy", source_cluster="cluster03", job="uwm/scrape", instance="10.0.1.1:9113", pod="nginx-0"}'
        values: '1 1 1'
      - series: 'nginx_up{namespace="artifact-registry-proxy", service="artifact-registry-proxy", source_cluster="cluster03", job="uwm/scrape", instance="10.0.1.2:9113", pod="nginx-1"}'
        values: '1 1 1'
    promql_expr_test:
      - expr: konflux_up
        eval_time: 2m
        exp_samples:
          - labels: 'konflux_up{check="nginx-proxy", namespace="artifact-registry-proxy", service="artifact-registry-proxy", source_cluster="cluster03"}'
            value: 1

  - interval: 1m
    # One replica down in artifact-registry-proxy namespace → konflux_up = 0
    input_series:
      - series: 'nginx_up{namespace="artifact-registry-proxy", service="artifact-registry-proxy", source_cluster="cluster03", job="uwm/scrape", instance="10.0.1.1:9113", pod="nginx-0"}'
        values: '1 1 1'
      - series: 'nginx_up{namespace="artifact-registry-proxy", service="artifact-registry-proxy", source_cluster="cluster03", job="uwm/scrape", instance="10.0.1.2:9113", pod="nginx-1"}'
        values: '1 0 0'
    promql_expr_test:
      - expr: konflux_up
        eval_time: 2m
        exp_samples:
          - labels: 'konflux_up{check="nginx-proxy", namespace="artifact-registry-proxy", service="artifact-registry-proxy", source_cluster="cluster03"}'
            value: 0

  - interval: 1m
    # A matching service in another namespace must not produce this availability signal
    input_series:
      - series: 'nginx_up{namespace="other", service="artifact-registry-proxy", source_cluster="cluster03"}'
        values: '1 1 1'
    promql_expr_test:
      - expr: 'konflux_up{namespace="other", service="artifact-registry-proxy"}'
        eval_time: 2m
        exp_samples: []

  - interval: 1m
    # All replicas up in container-image-proxy namespace → konflux_up = 1
    input_series:
      - series: 'squid_up{namespace="container-image-proxy", service="squid", source_cluster="cluster04", job="uwm/scrape", instance="10.0.2.1:9301", pod="squid-0"}'
        values: '1 1 1'
      - series: 'squid_up{namespace="container-image-proxy", service="squid", source_cluster="cluster04", job="uwm/scrape", instance="10.0.2.2:9301", pod="squid-1"}'
        values: '1 1 1'
    promql_expr_test:
      - expr: konflux_up
        eval_time: 2m
        exp_samples:
          - labels: 'konflux_up{check="squid-proxy", namespace="container-image-proxy", service="squid", source_cluster="cluster04"}'
            value: 1

  - interval: 1m
    # One replica down in container-image-proxy namespace → konflux_up = 0
    input_series:
      - series: 'squid_up{namespace="container-image-proxy", service="squid", source_cluster="cluster04", job="uwm/scrape", instance="10.0.2.1:9301", pod="squid-0"}'
        values: '1 1 1'
      - series: 'squid_up{namespace="container-image-proxy", service="squid", source_cluster="cluster04", job="uwm/scrape", instance="10.0.2.2:9301", pod="squid-1"}'
        values: '1 0 0'
    promql_expr_test:
      - expr: konflux_up
        eval_time: 2m
        exp_samples:
          - labels: 'konflux_up{check="squid-proxy", namespace="container-image-proxy", service="squid", source_cluster="cluster04"}'
            value: 0

  - interval: 1m
    # A matching service in another namespace must not produce this availability signal
    input_series:
      - series: 'squid_up{namespace="other", service="squid", source_cluster="cluster04"}'
        values: '1 1 1'
    promql_expr_test:
      - expr: 'konflux_up{namespace="other", service="squid"}'
        eval_time: 2m
        exp_samples: []

  - interval: 1m
    # Test artifact_registry_proxy namespace cache hit ratio
    input_series:
      - series: 'http_requests_total{namespace="artifact-registry-proxy", service="artifact-registry-proxy", source_cluster="cluster03", cache_status="HIT"}'
        values: '0+60x10'
      - series: 'http_requests_total{namespace="artifact-registry-proxy", service="artifact-registry-proxy", source_cluster="cluster03", cache_status="MISS"}'
        values: '0+20x10'
      - series: 'http_requests_total{namespace="artifact-registry-proxy", service="artifact-registry-proxy", source_cluster="cluster03", cache_status="BYPASS"}'
        values: '0+10x10'
    promql_expr_test:
      - expr: artifact_registry_proxy:cache_hit_ratio:rate5m
        eval_time: 6m
        exp_samples:
          - labels: 'artifact_registry_proxy:cache_hit_ratio:rate5m{namespace="artifact-registry-proxy", service="artifact-registry-proxy", source_cluster="cluster03"}'
            value: 66.66666666666666

  - interval: 1m
    # Test artifact_registry_proxy namespace cache hits
    input_series:
      - series: 'http_requests_total{namespace="artifact-registry-proxy", service="artifact-registry-proxy", source_cluster="cluster03", cache_status="HIT"}'
        values: '0+60x10'
      - series: 'http_requests_total{namespace="artifact-registry-proxy", service="artifact-registry-proxy", source_cluster="cluster03", cache_status="MISS"}'
        values: '0+20x10'
    promql_expr_test:
      - expr: artifact_registry_proxy:cache_hits:rate5m
        eval_time: 6m
        exp_samples:
          - labels: 'artifact_registry_proxy:cache_hits:rate5m{namespace="artifact-registry-proxy", service="artifact-registry-proxy", source_cluster="cluster03"}'
            value: 1

  - interval: 1m
    # Test artifact_registry_proxy namespace cache misses
    input_series:
      - series: 'http_requests_total{namespace="artifact-registry-proxy", service="artifact-registry-proxy", source_cluster="cluster03", cache_status="HIT"}'
        values: '0+60x10'
      - series: 'http_requests_total{namespace="artifact-registry-proxy", service="artifact-registry-proxy", source_cluster="cluster03", cache_status="MISS"}'
        values: '0+20x10'
    promql_expr_test:
      - expr: artifact_registry_proxy:cache_misses:rate5m
        eval_time: 6m
        exp_samples:
          - labels: 'artifact_registry_proxy:cache_misses:rate5m{namespace="artifact-registry-proxy", service="artifact-registry-proxy", source_cluster="cluster03"}'
            value: 0.33333333333333337

  - interval: 1m
    # Test artifact_registry_proxy namespace total requests
    input_series:
      - series: 'http_requests_total{namespace="artifact-registry-proxy", service="artifact-registry-proxy", source_cluster="cluster03", status="200"}'
        values: '0+50x10'
      - series: 'http_requests_total{namespace="artifact-registry-proxy", service="artifact-registry-proxy", source_cluster="cluster03", status="500"}'
        values: '0+10x10'
    promql_expr_test:
      - expr: artifact_registry_proxy:http_requests:rate5m
        eval_time: 6m
        exp_samples:
          - labels: 'artifact_registry_proxy:http_requests:rate5m{namespace="artifact-registry-proxy", service="artifact-registry-proxy", source_cluster="cluster03"}'
            value: 1

  - interval: 1m
    # Test artifact_registry_proxy namespace errors
    input_series:
      - series: 'http_requests_total{namespace="artifact-registry-proxy", service="artifact-registry-proxy", source_cluster="cluster03", status="200"}'
        values: '0+50x10'
      - series: 'http_requests_total{namespace="artifact-registry-proxy", service="artifact-registry-proxy", source_cluster="cluster03", status="500"}'
        values: '0+10x10'
    promql_expr_test:
      - expr: artifact_registry_proxy:http_errors:rate5m
        eval_time: 6m
        exp_samples:
          - labels: 'artifact_registry_proxy:http_errors:rate5m{namespace="artifact-registry-proxy", service="artifact-registry-proxy", source_cluster="cluster03"}'
            value: 0.16666666666666669

  - interval: 1m
    # Test container_image_proxy namespace cache hit ratio
    input_series:
      - series: 'squid_client_http_requests_total{namespace="container-image-proxy", service="squid", source_cluster="cluster04"}'
        values: '0+100x10'
      - series: 'squid_client_http_hits_total{namespace="container-image-proxy", service="squid", source_cluster="cluster04"}'
        values: '0+80x10'
    promql_expr_test:
      - expr: container_image_proxy:cache_hit_ratio:rate5m
        eval_time: 6m
        exp_samples:
          - labels: 'container_image_proxy:cache_hit_ratio:rate5m{namespace="container-image-proxy", service="squid", source_cluster="cluster04"}'
            value: 80

  - interval: 1m
    # Test container_image_proxy namespace cache hits
    input_series:
      - series: 'squid_client_http_hits_total{namespace="container-image-proxy", service="squid", source_cluster="cluster04"}'
        values: '0+80x10'
    promql_expr_test:
      - expr: container_image_proxy:cache_hits:rate5m
        eval_time: 6m
        exp_samples:
          - labels: 'container_image_proxy:cache_hits:rate5m{namespace="container-image-proxy", service="squid", source_cluster="cluster04"}'
            value: 1.3333333333333335

  - interval: 1m
    # Test container_image_proxy namespace cache misses
    input_series:
      - series: 'squid_client_http_requests_total{namespace="container-image-proxy", service="squid", source_cluster="cluster04"}'
        values: '0+100x10'
      - series: 'squid_client_http_hits_total{namespace="container-image-proxy", service="squid", source_cluster="cluster04"}'
        values: '0+80x10'
    promql_expr_test:
      - expr: container_image_proxy:cache_misses:rate5m
        eval_time: 6m
        exp_samples:
          - labels: 'container_image_proxy:cache_misses:rate5m{namespace="container-image-proxy", service="squid", source_cluster="cluster04"}'
            value: 0.33333333333333326

  - interval: 1m
    # Test container_image_proxy namespace total requests
    input_series:
      - series: 'squid_client_http_requests_total{namespace="container-image-proxy", service="squid", source_cluster="cluster04"}'
        values: '0+85x10'
    promql_expr_test:
      - expr: container_image_proxy:http_requests:rate5m
        eval_time: 6m
        exp_samples:
          - labels: 'container_image_proxy:http_requests:rate5m{namespace="container-image-proxy", service="squid", source_cluster="cluster04"}'
            value: 1.4166666666666667

  - interval: 1m
    # Test container_image_proxy namespace errors
    input_series:
      - series: 'squid_client_http_errors_total{namespace="container-image-proxy", service="squid", source_cluster="cluster04"}'
        values: '0+15x10'
    promql_expr_test:
      - expr: container_image_proxy:http_errors:rate5m
        eval_time: 6m
        exp_samples:
          - labels: 'container_image_proxy:http_errors:rate5m{namespace="container-image-proxy", service="squid", source_cluster="cluster04"}'
            value: 0.25
