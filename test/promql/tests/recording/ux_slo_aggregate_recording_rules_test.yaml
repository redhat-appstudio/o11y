        values: "0x5"
      - series: 'konflux_build_duration_slo_breach{source_cluster="cluster-1", exported_namespace="tenant-09", application="app1", component="comp1"}'
        values: "0x5"
      - series: 'konflux_build_duration_slo_breach{source_cluster="cluster-1", exported_namespace="tenant-10", application="app1", component="comp1"}'
        values: "0x5"
      - series: 'konflux_build_duration_slo_breach{source_cluster="cluster-1", exported_namespace="tenant-11", application="app1", component="comp1"}'
        values: "0x5"
      - series: 'konflux_build_duration_slo_breach{source_cluster="cluster-1", exported_namespace="tenant-12", application="app1", component="comp1"}'
        values: "0x5"
      - series: 'konflux_build_duration_slo_breach{source_cluster="cluster-1", exported_namespace="tenant-13", application="app1", component="comp1"}'
        values: "0x5"
      - series: 'konflux_build_duration_slo_breach{source_cluster="cluster-1", exported_namespace="tenant-14", application="app1", component="comp1"}'
        values: "0x5"
      - series: 'konflux_build_duration_slo_breach{source_cluster="cluster-1", exported_namespace="tenant-15", application="app1", component="comp1"}'
        values: "0x5"
      - series: 'konflux_build_duration_slo_breach{source_cluster="cluster-1", exported_namespace="tenant-16", application="app1", component="comp1"}'
        values: "0x5"
      - series: 'konflux_build_duration_slo_breach{source_cluster="cluster-1", exported_namespace="tenant-17", application="app1", component="comp1"}'
        values: "0x5"
      - series: 'konflux_build_duration_slo_breach{source_cluster="cluster-1", exported_namespace="tenant-18", application="app1", component="comp1"}'
        values: "0x5"
      - series: 'konflux_build_duration_slo_breach{source_cluster="cluster-1", exported_namespace="tenant-19", application="app1", component="comp1"}'
        values: "0x5"
      - series: 'konflux_build_duration_slo_breach{source_cluster="cluster-1", exported_namespace="tenant-20", application="app1", component="comp1"}'
        values: "0x5"
      - series: 'konflux_build_duration_slo_breach{source_cluster="cluster-1", exported_namespace="tenant-21", application="app1", component="comp1"}'
        values: "0x5"
    promql_expr_test:
      # 1/21 = 4.76% < 5% -> breach = 0
      - expr: konflux:aggregate_performance_slo_breach
        eval_time: 5m
        exp_samples:
          - labels: 'konflux:aggregate_performance_slo_breach{source_cluster="cluster-1"}'
            value: 0

  - name: AggregatePerformanceSloBreachAtExact5PercentBoundary
    interval: 5m
    input_series:
      # 1 tenant breaching out of 20 = exactly 5% -> should fire (>= 0.05)
      - series: 'konflux_build_duration_slo_breach{source_cluster="cluster-1", exported_namespace="tenant-01", application="app1", component="comp1"}'
        values: "1x5"
      - series: 'konflux_build_duration_slo_breach{source_cluster="cluster-1", exported_namespace="tenant-02", application="app1", component="comp1"}'
        values: "0x5"
      - series: 'konflux_build_duration_slo_breach{source_cluster="cluster-1", exported_namespace="tenant-03", application="app1", component="comp1"}'
        values: "0x5"
      - series: 'konflux_build_duration_slo_breach{source_cluster="cluster-1", exported_namespace="tenant-04", application="app1", component="comp1"}'
        values: "0x5"
      - series: 'konflux_build_duration_slo_breach{source_cluster="cluster-1", exported_namespace="tenant-05", application="app1", component="comp1"}'
        values: "0x5"
      - series: 'konflux_build_duration_slo_breach{source_cluster="cluster-1", exported_namespace="tenant-06", application="app1", component="comp1"}'
        values: "0x5"
      - series: 'konflux_build_duration_slo_breach{source_cluster="cluster-1", exported_namespace="tenant-07", application="app1", component="comp1"}'
        values: "0x5"
      - series: 'konflux_build_duration_slo_breach{source_cluster="cluster-1", exported_namespace="tenant-08", application="app1", component="comp1"}'
        values: "0x5"
      - series: 'konflux_build_duration_slo_breach{source_cluster="cluster-1", exported_namespace="tenant-09", application="app1", component="comp1"}'
        values: "0x5"
      - series: 'konflux_build_duration_slo_breach{source_cluster="cluster-1", exported_namespace="tenant-10", application="app1", component="comp1"}'
        values: "0x5"
      - series: 'konflux_build_duration_slo_breach{source_cluster="cluster-1", exported_namespace="tenant-11", application="app1", component="comp1"}'
        values: "0x5"
      - series: 'konflux_build_duration_slo_breach{source_cluster="cluster-1", exported_namespace="tenant-12", application="app1", component="comp1"}'
        values: "0x5"
      - series: 'konflux_build_duration_slo_breach{source_cluster="cluster-1", exported_namespace="tenant-13", application="app1", component="comp1"}'
        values: "0x5"
      - series: 'konflux_build_duration_slo_breach{source_cluster="cluster-1", exported_namespace="tenant-14", application="app1", component="comp1"}'
        values: "0x5"
      - series: 'konflux_build_duration_slo_breach{source_cluster="cluster-1", exported_namespace="tenant-15", application="app1", component="comp1"}'
        values: "0x5"
      - series: 'konflux_build_duration_slo_breach{source_cluster="cluster-1", exported_namespace="tenant-16", application="app1", component="comp1"}'
        values: "0x5"
      - series: 'konflux_build_duration_slo_breach{source_cluster="cluster-1", exported_namespace="tenant-17", application="app1", component="comp1"}'
        values: "0x5"
      - series: 'konflux_build_duration_slo_breach{source_cluster="cluster-1", exported_namespace="tenant-18", application="app1", component="comp1"}'
        values: "0x5"
      - series: 'konflux_build_duration_slo_breach{source_cluster="cluster-1", exported_namespace="tenant-19", application="app1", component="comp1"}'
        values: "0x5"
      - series: 'konflux_build_duration_slo_breach{source_cluster="cluster-1", exported_namespace="tenant-20", application="app1", component="comp1"}'
        values: "0x5"
    promql_expr_test:
      # 1/20 = 5.0% >= 5% -> breach = 1
      - expr: konflux:aggregate_performance_slo_breach
        eval_time: 5m
        exp_samples:
          - labels: 'konflux:aggregate_performance_slo_breach{source_cluster="cluster-1"}'
            value: 1

  - name: AggregatePerformanceSloBreachFromIntegrationDomain
    interval: 5m
    input_series:
      # All build healthy, but 1 integration breaching out of 5 tenants = 20%
      - series: 'konflux_build_duration_slo_breach{source_cluster="cluster-1", exported_namespace="tenant-a", application="app1", component="comp1"}'
        values: "0x5"
      - series: 'konflux_build_duration_slo_breach{source_cluster="cluster-1", exported_namespace="tenant-b", application="app1", component="comp1"}'
        values: "0x5"
      - series: 'konflux_build_duration_slo_breach{source_cluster="cluster-1", exported_namespace="tenant-c", application="app1", component="comp1"}'
        values: "0x5"
      - series: 'konflux_build_duration_slo_breach{source_cluster="cluster-1", exported_namespace="tenant-d", application="app1", component="comp1"}'
        values: "0x5"
      - series: 'konflux_build_duration_slo_breach{source_cluster="cluster-1", exported_namespace="tenant-e", application="app1", component="comp1"}'
        values: "0x5"
      - series: 'konflux_integration_duration_slo_breach{source_cluster="cluster-1", exported_namespace="tenant-a", application="app1", component="comp1", scenario="sc1"}'
        values: "1x5"
      - series: 'konflux_integration_duration_slo_breach{source_cluster="cluster-1", exported_namespace="tenant-b", application="app1", component="comp1", scenario="sc1"}'
        values: "0x5"
    promql_expr_test:
      # 1/5 = 20% >= 5% -> breach = 1
      - expr: konflux:aggregate_performance_slo_breach
        eval_time: 5m
        exp_samples:
          - labels: 'konflux:aggregate_performance_slo_breach{source_cluster="cluster-1"}'
            value: 1

  - name: AggregatePerformanceSloBreachFromReleaseDomain
    interval: 5m
    input_series:
      # All build healthy, 1 release_cr breaching out of 5 tenants = 20%
      # Domain-specific labels (build_type, automated) ensure or doesn't dedup
      - series: 'konflux_build_duration_slo_breach{source_cluster="cluster-1", exported_namespace="tenant-a", application="app1", component="comp1", build_type="docker", event_type="push"}'
        values: "0x5"
      - series: 'konflux_build_duration_slo_breach{source_cluster="cluster-1", exported_namespace="tenant-b", application="app1", component="comp1", build_type="docker", event_type="push"}'
        values: "0x5"
      - series: 'konflux_build_duration_slo_breach{source_cluster="cluster-1", exported_namespace="tenant-c", application="app1", component="comp1", build_type="docker", event_type="push"}'
        values: "0x5"
      - series: 'konflux_build_duration_slo_breach{source_cluster="cluster-1", exported_namespace="tenant-d", application="app1", component="comp1", build_type="docker", event_type="push"}'
        values: "0x5"
      - series: 'konflux_build_duration_slo_breach{source_cluster="cluster-1", exported_namespace="tenant-e", application="app1", component="comp1", build_type="docker", event_type="push"}'
        values: "0x5"
      - series: 'konflux_release_cr_duration_slo_breach{source_cluster="cluster-1", exported_namespace="tenant-a", application="app1", component="comp1", automated="true", event_type="push"}'
        values: "1x5"
      - series: 'konflux_release_cr_duration_slo_breach{source_cluster="cluster-1", exported_namespace="tenant-b", application="app1", component="comp1", automated="true", event_type="push"}'
        values: "0x5"
