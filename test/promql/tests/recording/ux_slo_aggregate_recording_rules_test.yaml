            value: 1

  # --- Layer 3: Cluster-level breach ---

  - name: ClusterUxSloBreachFromAggregateOnly
    interval: 5m
    input_series:
      - series: 'konflux:aggregate_performance_slo_breach{source_cluster="cluster-1"}'
        values: "1x5"
      - series: 'konflux_cluster:kueue_admission_wait_time_seconds:saturation_7d{priority_class="pre-merge-build", source_cluster="cluster-1"}'
        values: "0.03x5"
    promql_expr_test:
      - expr: konflux:cluster_ux_slo_breach
        eval_time: 5m
        exp_samples:
          - labels: 'konflux:cluster_ux_slo_breach{source_cluster="cluster-1"}'
            value: 1

  - name: ClusterUxSloBreachFromKueueOnly
    interval: 5m
    input_series:
      # One priority class above threshold, one below -- max should pick up the breach
      - series: 'konflux:aggregate_performance_slo_breach{source_cluster="cluster-1"}'
        values: "0x5"
      - series: 'konflux_cluster:kueue_admission_wait_time_seconds:saturation_7d{priority_class="pre-merge-build", source_cluster="cluster-1"}'
        values: "0.03x5"
      - series: 'konflux_cluster:kueue_admission_wait_time_seconds:saturation_7d{priority_class="post-merge-build", source_cluster="cluster-1"}'
        values: "0.06x5"
    promql_expr_test:
      - expr: konflux:cluster_ux_slo_breach
        eval_time: 5m
        exp_samples:
          - labels: 'konflux:cluster_ux_slo_breach{source_cluster="cluster-1"}'
            value: 1

  - name: ClusterUxSloBreachFromBothSources
    interval: 5m
    input_series:
      - series: 'konflux:aggregate_performance_slo_breach{source_cluster="cluster-1"}'
        values: "1x5"
      - series: 'konflux_cluster:kueue_admission_wait_time_seconds:saturation_7d{priority_class="pre-merge-build", source_cluster="cluster-1"}'
        values: "0.06x5"
    promql_expr_test:
      - expr: konflux:cluster_ux_slo_breach
        eval_time: 5m
        exp_samples:
          - labels: 'konflux:cluster_ux_slo_breach{source_cluster="cluster-1"}'
            value: 1

  - name: ClusterUxSloEmitsZeroForKueueOnlyCluster
    interval: 5m
    input_series:
      # Cluster with kueue data but no tenant breach data
      - series: 'konflux_cluster:kueue_admission_wait_time_seconds:saturation_7d{priority_class="pre-merge-build", source_cluster="cluster-1"}'
        values: "0.03x5"
    promql_expr_test:
      - expr: konflux:cluster_ux_slo_breach
        eval_time: 5m
        exp_samples:
          - labels: 'konflux:cluster_ux_slo_breach{source_cluster="cluster-1"}'
            value: 0

  - name: ClusterUxSloBreachFromKueueOnlyCluster
    interval: 5m
    input_series:
      # Cluster with kueue data only (no tenant breach data), kueue breaching
      - series: 'konflux_cluster:kueue_admission_wait_time_seconds:saturation_7d{priority_class="pre-merge-build", source_cluster="cluster-1"}'
        values: "0.06x5"
    promql_expr_test:
      - expr: konflux:cluster_ux_slo_breach
        eval_time: 5m
        exp_samples:
          - labels: 'konflux:cluster_ux_slo_breach{source_cluster="cluster-1"}'
            value: 1

  - name: ClusterUxSloWithTenantIdLabelCollision
    interval: 5m
    input_series:
      # Simulates RHOBS injecting tenant_id into all metrics.
      # max by (source_cluster) drops tenant_id from kueue, causing label
      # mismatch with aggregate (which keeps tenant_id). The or chain then
      # produces two series for the same source_cluster that collide after
      # rule labels are applied.
      - series: 'konflux:aggregate_performance_slo_breach{source_cluster="cluster-1", tenant_id="rhobs-tenant"}'
        values: "1x5"
      - series: 'konflux_cluster:kueue_admission_wait_time_seconds:saturation_7d{priority_class="pre-merge-build", source_cluster="cluster-1", tenant_id="rhobs-tenant"}'
        values: "0.03x5"
    promql_expr_test:
      # Should produce exactly ONE series. With max by (source_cluster), it
      # produces TWO (one with tenant_id, one without) which is the bug.
      - expr: konflux:cluster_ux_slo_breach
        eval_time: 5m
        exp_samples:
          - labels: 'konflux:cluster_ux_slo_breach{source_cluster="cluster-1", tenant_id="rhobs-tenant"}'
            value: 1

  - name: ClusterUxSloNoBreachWhenBothHealthy
    interval: 5m
    input_series:
      - series: 'konflux:aggregate_performance_slo_breach{source_cluster="cluster-1"}'
        values: "0x5"
      - series: 'konflux_cluster:kueue_admission_wait_time_seconds:saturation_7d{priority_class="pre-merge-build", source_cluster="cluster-1"}'
        values: "0.04x5"
    promql_expr_test:
      - expr: konflux:cluster_ux_slo_breach
        eval_time: 5m
        exp_samples:
          - labels: 'konflux:cluster_ux_slo_breach{source_cluster="cluster-1"}'
            value: 0
