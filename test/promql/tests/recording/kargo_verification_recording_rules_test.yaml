evaluation_interval: 1m

rule_files:
  - kargo_verification_recording_rules.yaml

tests:
  - name: KargoVerificationCountAggregatesByComponentStagePhase
    interval: 1m
    input_series:
      # Two Successful runs for the same component/ring (unique names must collapse)
      - series: 'analysis_run_phase{namespace="argo-rollouts", exported_namespace="kargo-infra-common", name="ring-1-container-image-proxy.aaa.111", phase="Successful"}'
        values: '1 1 1 1 1'
      - series: 'analysis_run_phase{namespace="argo-rollouts", exported_namespace="kargo-infra-common", name="ring-1-container-image-proxy.bbb.222", phase="Successful"}'
        values: '1 1 1 1 1'
      # Failed + Running for the same component
      - series: 'analysis_run_phase{namespace="argo-rollouts", exported_namespace="kargo-infra-common", name="ring-1-container-image-proxy.ccc.333", phase="Failed"}'
        values: '1 1 1 1 1'
      - series: 'analysis_run_phase{namespace="argo-rollouts", exported_namespace="kargo-infra-common", name="ring-1-container-image-proxy.ddd.444", phase="Running"}'
        values: '1 1 1 1 1'
      # Different ring — must not mix into ring-1
      - series: 'analysis_run_phase{namespace="argo-rollouts", exported_namespace="kargo-infra-common", name="ring-2-container-image-proxy.eee.555", phase="Successful"}'
        values: '1 1 1 1 1'

    promql_expr_test:
      - expr: kargo:verification:count
        eval_time: 5m
        exp_samples:
          - labels: 'kargo:verification:count{exported_namespace="kargo-infra-common", component="container-image-proxy", stage="ring-1", phase="Successful"}'
            value: 2
          - labels: 'kargo:verification:count{exported_namespace="kargo-infra-common", component="container-image-proxy", stage="ring-1", phase="Failed"}'
            value: 1
          - labels: 'kargo:verification:count{exported_namespace="kargo-infra-common", component="container-image-proxy", stage="ring-1", phase="Running"}'
            value: 1
          - labels: 'kargo:verification:count{exported_namespace="kargo-infra-common", component="container-image-proxy", stage="ring-2", phase="Successful"}'
            value: 1
